<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ejb-capture</title>
<style>
  :root { --bg:#f3f4f6; --panel:#fff; --fg:#111827; --muted:#6b7280; --line:#e5e7eb; --strong:#cbd5e1;
    --web:#0f766e; --ejb:#2563eb; --mdb:#ea580c; --queue:#64748b; --client:#64748b; --db:#7c3aed;
    --err:#dc2626; --err-soft:#fef2f2; --sel:#2563eb; --sel-soft:rgba(37,99,235,.08);
    --marker:#fff7d6; --ref:#e6fffa; --lazy:#fefcbf; --handle:#fee2e2; --skipped:#e2e8f0; --type:#eef2ff; --flash:#fde68a;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  * { box-sizing:border-box; }
  html, body { height:100%; margin:0; font:13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, system-ui, sans-serif; color:var(--fg); background:var(--bg); overflow:hidden; }
  a { color:var(--ejb); }
  button { font:inherit; }
  .btn { border:1px solid var(--strong); background:var(--panel); color:var(--fg); border-radius:6px; padding:4px 12px; cursor:pointer; }
  .btn:hover:not(:disabled) { border-color:#94a3b8; background:#f8fafc; }
  .btn:disabled { opacity:.5; cursor:default; }
  .btn.primary { background:var(--ejb); border-color:var(--ejb); color:#fff; } .btn.primary:hover:not(:disabled) { background:#1d4ed8; }
  .btn.danger { color:var(--err); border-color:#fca5a5; } .btn.danger:hover:not(:disabled) { background:var(--err-soft); }
  .btn.small { padding:1px 8px; font-size:12px; }
  input[type=text] { font:inherit; border:1px solid var(--strong); border-radius:6px; padding:4px 8px; background:var(--panel); }

  /* header */
  header .bar { display:flex; gap:14px; align-items:center; padding:8px 16px; border-bottom:1px solid var(--line); background:var(--panel); flex-wrap:wrap; }
  .brand { font-weight:700; letter-spacing:-.01em; color:var(--fg); text-decoration:none; font-size:14px; }
  .pill { display:inline-flex; align-items:center; gap:6px; padding:2px 10px; border-radius:999px; border:1px solid var(--line); font-size:12px; background:#fff; }
  .pill::before { content:''; width:8px; height:8px; border-radius:50%; background:#94a3b8; }
  .pill.ok::before { background:#10b981; } .pill.warn::before { background:#f59e0b; } .pill.bad::before { background:var(--err); }
  .servers { display:inline-flex; gap:6px; flex-wrap:wrap; font-size:12px; color:var(--muted); }
  .servers .server { padding:1px 8px; border-radius:6px; border:1px solid var(--line); background:#fff; color:var(--fg); }
  .servers .server.noagent { border-color:#fca5a5; background:var(--err-soft); }
  .servers .server.none { border-style:dashed; color:var(--muted); }
  .controls { margin-left:auto; display:inline-flex; gap:8px; align-items:center; }
  .controls .reason { color:var(--muted); font-size:12px; max-width:480px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #active-link { font-size:12px; }
  .rec { color:#fff; background:#ea580c; border-radius:4px; padding:0 6px; font-size:11px; font-weight:700; letter-spacing:.03em; }

  /* home */
  #home { padding:18px 24px; max-width:1200px; overflow:auto; height:calc(100vh - 42px); }
  #home h1 { font-size:16px; margin:0 0 4px; }
  #home .hint { color:var(--muted); margin:0 0 14px; }
  table.recordings { border-collapse:collapse; width:100%; background:var(--panel); border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  table.recordings th, table.recordings td { text-align:left; padding:8px 12px; border-bottom:1px solid var(--line); vertical-align:middle; }
  table.recordings tr:last-child td { border-bottom:none; }
  table.recordings th { color:var(--muted); font-weight:600; font-size:11px; text-transform:uppercase; letter-spacing:.05em; background:#fafafa; }
  table.recordings tr.active td { background:#fff7ed; }
  table.recordings td.actions { text-align:right; white-space:nowrap; }
  table.recordings .name { font-weight:600; }
  table.recordings .id { color:var(--muted); font-family:var(--mono); font-size:12px; }
  .confirm { display:inline-flex; gap:6px; align-items:center; color:var(--err); font-size:12px; }
  .empty { color:var(--muted); padding:20px; }
  .err-box { color:var(--err); padding:20px; white-space:pre-wrap; }

  /* recording view */
  #recording .rec-bar { display:flex; gap:12px; align-items:center; padding:6px 16px; border-bottom:1px solid var(--line); background:var(--panel); font-size:12px; color:var(--muted); white-space:nowrap; overflow:hidden; }
  #recording .rec-bar b { color:var(--fg); }
  #recording .rec-bar .spacer { margin-left:auto; }
  .legend { display:flex; gap:16px; font-size:11.5px; color:var(--muted); align-items:center; }
  .legend svg { vertical-align:middle; margin-right:5px; }
  #seq { position:relative; overflow:auto; height:calc(100vh - 42px - 34px); }
  #zoomwrap { transform-origin:0 0; }
  #lanes { position:sticky; top:0; z-index:3; background:var(--panel); border-bottom:1px solid var(--line); }
  .apps, .heads { display:flex; }
  .app { height:20px; font:600 10.5px/20px -apple-system, system-ui, sans-serif; letter-spacing:.07em; text-transform:uppercase; color:#475569; text-align:center; background:#eef0f3; border-right:2px solid #fff; overflow:hidden; }
  .app.plain { background:transparent; }
  .lane-h { height:54px; padding:5px 8px 0; border-right:1px solid var(--line); overflow:hidden; border-bottom:3px solid var(--strong); }
  .lane-h .name { font-weight:600; font-size:12px; line-height:1.2; overflow-wrap:anywhere; max-height:29px; overflow:hidden; }
  .lane-h .kind { font-size:10.5px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .lane-h.web { border-bottom-color:var(--web); } .lane-h.ejb { border-bottom-color:var(--ejb); } .lane-h.mdb { border-bottom-color:var(--mdb); } .lane-h.db { border-bottom-color:var(--db); }
  #body { position:relative; padding-bottom:60px; }
  #body svg { position:absolute; left:0; top:0; pointer-events:none; }
  .lifeline { stroke:#dde1e6; stroke-width:1; }
  .act { stroke:#fff; stroke-width:1; } .act.web { fill:var(--web); } .act.ejb { fill:var(--ejb); } .act.mdb { fill:var(--mdb); } .act.db { fill:var(--db); } .act.queue, .act.client { fill:var(--queue); }
  .call { fill:none; stroke:#475569; stroke-width:1.6; } .call.failed { stroke:var(--err); }
  .ret { fill:none; stroke:#94a3b8; stroke-width:1.2; stroke-dasharray:5 3; } .ret.failed { stroke:var(--err); }
  .hop { fill:none; stroke:#475569; stroke-width:1.6; stroke-dasharray:1.5 4; stroke-linecap:round; }
  .entry { position:absolute; left:0; right:0; height:40px; display:flex; align-items:center; gap:10px; padding:0 16px; background:#e9ecf1; border-top:1px solid var(--line); border-bottom:1px solid var(--line); font-size:13px; white-space:nowrap; overflow:hidden; }
  .entry .n { font-weight:700; color:var(--muted); } .entry .t { font-weight:700; } .entry .m { color:var(--muted); font-size:12px; }
  .row { position:absolute; left:0; right:0; cursor:pointer; }
  .row:hover { background:rgba(37,99,235,.04); } .row.selected { background:var(--sel-soft); }
  .lbl { position:absolute; top:2px; font-size:12.5px; white-space:nowrap; line-height:1.3; overflow:hidden; text-overflow:ellipsis; }
  .lbl.flip { text-align:right; }
  .lbl .m { font-weight:600; } .lbl .m.sql { font-weight:500; font-family:var(--mono); font-size:11.5px; } .lbl .sub { color:var(--muted); font-size:12px; }
  .tag { display:inline-block; font-size:10px; font-weight:700; padding:0 5px; border-radius:999px; margin-left:6px; vertical-align:1px; border:1px solid var(--strong); color:#475569; background:#fff; }
  .tag.ok { color:var(--web); border-color:#99d6c7; } .tag.bad { color:#fff; background:var(--err); border-color:var(--err); } .tag.hop { color:#334155; background:#f1f5f9; } .tag.n { color:var(--db); border-color:#c4b5fd; } .tag.trunc { color:#fff; background:#c2410c; border-color:#c2410c; }
  .dur { position:absolute; right:14px; top:4px; font-size:11.5px; color:var(--muted); font-variant-numeric:tabular-nums; }
  .rlbl { position:absolute; top:1px; font-size:11px; color:var(--muted); white-space:nowrap; }

  /* details window */
  #win { position:fixed; right:24px; top:90px; width:460px; height:72vh; min-width:320px; min-height:160px; background:var(--panel); border:1px solid var(--strong); border-radius:10px; box-shadow:0 12px 40px rgba(15,23,42,.18); display:flex; flex-direction:column; resize:both; overflow:hidden; z-index:20; }
  #win[hidden] { display:none; }
  #win .titlebar { display:flex; align-items:center; gap:8px; padding:8px 10px 8px 14px; border-bottom:1px solid var(--line); background:#f8fafc; cursor:move; user-select:none; }
  #win .titlebar b { flex:1; font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #win .titlebar button { border:none; background:transparent; font-size:16px; color:var(--muted); cursor:pointer; width:26px; height:26px; border-radius:6px; } #win .titlebar button:hover { background:#e5e7eb; color:var(--fg); }
  #detail-body { flex:1; overflow:auto; padding:10px 16px 30px; min-width:0; }
  #detail-body h2 { font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:14px 0 6px; font-weight:600; }
  .chips { display:flex; gap:4px; flex-wrap:wrap; margin-bottom:8px; }
  .chip { display:inline-block; font-size:10.5px; line-height:16px; padding:0 7px; border-radius:999px; border:1px solid var(--line); color:var(--muted); background:#fff; white-space:nowrap; }
  .chip.err { color:#fff; background:var(--err); border-color:var(--err); font-weight:600; } .chip.trunc { color:#fff; background:#c2410c; border-color:#c2410c; }
  .path { font-size:12px; color:var(--muted); line-height:1.7; } .path b { color:var(--fg); font-weight:600; } .path .hopl { font-size:11px; color:#334155; background:#f1f5f9; border-radius:4px; padding:0 5px; }
  .facts { display:grid; grid-template-columns:max-content 1fr; gap:3px 12px; font-size:12px; } .facts dt { color:var(--muted); } .facts dd { margin:0; font-family:var(--mono); font-size:11.5px; word-break:break-all; white-space:pre-wrap; }
  .handoff-box { margin:6px 0; font-size:12px; background:#f1f5f9; border:1px solid var(--line); border-radius:6px; padding:4px 8px; } .handoff-box a { cursor:pointer; }
  pre.sqltext { margin:0; font:12px/1.5 var(--mono); background:#f8fafc; border:1px solid var(--line); border-radius:8px; padding:10px 12px; white-space:pre-wrap; word-break:break-word; }
  .group-table { width:100%; border-collapse:collapse; font-size:12px; font-variant-numeric:tabular-nums; }
  .group-table td, .group-table th { padding:2px 6px; border-bottom:1px solid var(--line); text-align:left; }
  .group-table tr { cursor:pointer; } .group-table tr:hover td { background:#f8fafc; } .group-table tr.selected td { background:var(--sel-soft); }
  .json { font:12px/1.45 var(--mono); white-space:pre-wrap; word-break:break-word; }
  .json .row { display:block; padding-left:var(--indent, 0); position:static; cursor:default; }
  .json .row:hover { background:transparent; }
  .json .k { color:#475569; } .json .s { color:#1d4ed8; } .json .n { color:#7c3aed; } .json .b { color:#b45309; } .json .z { color:var(--muted); }
  .json .m { background:var(--marker); border-radius:2px; padding:0 2px; }
  .json .m.type { background:var(--type); } .json .m.ref { background:var(--ref); } .json .m.lazy { background:var(--lazy); }
  .json .m.handle { background:var(--handle); } .json .m.skipped { background:var(--skipped); } .json .m.truncated { background:#fbd38d; } .json .m.unserializable { background:var(--handle); }
  .json .row.flagged { outline:2px solid var(--err); outline-offset:-1px; background:var(--err-soft); }
  .json .row.flash { animation:flash 1.6s ease-out; }
  @keyframes flash { 0% { background:var(--flash); } 100% { background:transparent; } }
  .json .fold { cursor:pointer; color:var(--muted); user-select:none; }
  .json .text-block { display:block; margin:2px 0 2px 1em; padding:4px 6px; background:#f8fafc; border:1px solid var(--line); border-radius:4px; max-height:320px; overflow:auto; white-space:pre-wrap; }
  .lineage { display:inline-block; margin-left:8px; font:11px system-ui, sans-serif; background:#ffedd5; border:1px solid #fdba74; border-radius:4px; padding:0 5px; vertical-align:baseline; }
  .lineage a { color:#9a3412; text-decoration:underline; cursor:pointer; } .lineage .alt { color:var(--muted); }
  .lineage.class-userInput { background:#ccfbf1; border-color:#5eead4; } .lineage.class-environment { background:#f1f5f9; border-color:#cbd5e1; } .lineage.uses { background:#dbeafe; border-color:#93c5fd; }
  details.sec { border-top:1px solid var(--line); padding:6px 0; }
  details.sec > summary { cursor:pointer; font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); font-weight:600; padding:4px 0; list-style:none; display:flex; gap:8px; align-items:center; }
  details.sec > summary::before { content:'▸'; color:var(--muted); font-size:10px; } details.sec[open] > summary::before { content:'▾'; }
  details.sec > summary .cnt { font-weight:400; text-transform:none; letter-spacing:0; }
  .hint { color:var(--muted); font-size:12px; }
</style>
</head>
<body>
<header>
  <div class="bar">
    <a id="nav-home" class="brand" href="#">ejb-capture</a>
    <span id="state-message" class="pill">…</span>
    <span id="servers" class="servers"></span>
    <span class="controls">
      <a id="active-link" hidden></a>
      <input id="name" type="text" placeholder="recording name (optional)" size="22">
      <button id="btn-start" class="btn primary" disabled>Start</button>
      <button id="btn-stop" class="btn" disabled>Stop</button>
      <span id="start-reason" class="reason"></span>
    </span>
  </div>
</header>
<section id="home">
  <h1>Recordings</h1>
  <p id="domain-meta" class="hint"></p>
  <div id="home-body" class="empty">loading…</div>
</section>
<section id="recording" hidden>
  <div class="rec-bar">
    <a href="#">‹ recordings</a>
    <span id="recording-meta"></span>
    <span class="spacer"></span>
    <button id="btn-details" class="btn small" title="show the details window">Details</button>
    <span id="rec-delete"></span>
    <span class="legend">
      <span><svg width="34" height="10"><line x1="0" y1="5" x2="26" y2="5" stroke="#475569" stroke-width="1.6"/><path d="M26,1 L33,5 L26,9 z" fill="#475569"/></svg>call</span>
      <span><svg width="34" height="10"><line x1="8" y1="5" x2="34" y2="5" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="5 3"/><path d="M8,1 L1,5 L8,9 z" fill="#fff" stroke="#94a3b8"/></svg>return</span>
      <span><svg width="34" height="10"><line x1="0" y1="5" x2="26" y2="5" stroke="#475569" stroke-width="1.6" stroke-dasharray="1.5 4" stroke-linecap="round"/><path d="M26,1 L33,5 L26,9 z" fill="#475569"/></svg>continues on another thread</span>
      <span><svg width="14" height="10"><rect x="2" y="1" width="10" height="8" rx="2" fill="#dc2626"/></svg>failed</span>
    </span>
  </div>
  <section id="seq"><div id="zoomwrap"><div id="lanes"><div class="apps" id="apps"></div><div class="heads" id="heads"></div></div><div id="body" class="empty">loading…</div></div></section>
</section>
<div id="win" hidden><div class="titlebar" id="win-title"><b id="win-name">Details</b><button id="win-close" title="close">×</button></div><div id="detail-body" class="empty">Select a call.</div></div>
<script>
'use strict';

// ---- state --------------------------------------------------------------------------------

const state = {
  domain: null,            // last /api/state
  view: 'home',            // 'home' | 'recording'
  recordingId: null,
  index: null,             // /api/recordings/{id}
  traces: new Map(),       // trace id -> trace JSON (kept across index refreshes)
  model: null,             // what the diagram is built from (buildModel)
  selectedTrace: null,
  selectedSpan: null,      // span id within selectedTrace
  selectedGroup: null,     // a grouped run's key when its row is selected
  expanded: new Map(),     // group key -> how many of its calls are drawn one by one
  scale: 1,
  confirmDelete: null,
  busy: false,
};

const $ = id => document.getElementById(id);

async function api(path, options) {
  const r = await fetch(path, Object.assign({ cache: 'no-store' }, options || {}));
  const text = await r.text();
  let body = null;
  try { body = text ? JSON.parse(text) : null; } catch (e) { body = { error: text }; }
  if (!r.ok) throw new Error(body && body.error ? body.error : `${r.status} ${path}`);
  return body;
}

// ---- header: state, servers, start/stop --------------------------------------------------

async function pollState() {
  try {
    state.domain = await api('/api/state');
    renderTop();
  } catch (e) {
    $('state-message').textContent = `page server unreachable: ${e.message}`;
    $('state-message').className = 'pill bad';
    $('btn-start').disabled = true;
    $('btn-stop').disabled = true;
  }
}

function renderTop() {
  const d = state.domain;
  const msg = $('state-message');
  msg.textContent = d.message;
  msg.className = 'pill ' + (d.kind === 'READY' ? 'ok' : d.kind === 'ENABLED_SERVER_DOWN' ? 'warn' : 'bad');
  $('domain-meta').textContent = `${d.domain} · WebLogic ${d.webLogicVersion} · recordings in ${d.outDir}`;
  const servers = $('servers');
  servers.innerHTML = '';
  if (!d.servers.length) servers.appendChild(el('span', 'server none', 'no server JVM of this domain is running'));
  for (const s of d.servers) {
    const span = el('span', 'server ' + (s.agentLoaded ? 'agent' : 'noagent'));
    span.textContent = `${s.serverName} · pid ${s.pid} · ` + (s.agentLoaded
      ? (s.recording ? `recording ${s.traceCount} trace${s.traceCount === 1 ? '' : 's'}${s.droppedTraces ? ', ' + s.droppedTraces + ' dropped' : ''}` : 'agent idle')
      : 'no agent, restart it');
    if (s.agentLoaded && !s.agentCurrent) span.textContent += ' · older agent build; restart to update';
    span.title = s.agentBuild ? `agent ${s.agentBuild}` : '';
    servers.appendChild(span);
  }
  const active = d.activeRecordingId;
  const start = $('btn-start');
  const stop = $('btn-stop');
  start.disabled = state.busy || !d.ready || !!active;
  stop.disabled = state.busy || !active;
  $('start-reason').textContent = start.disabled && !state.busy && !active ? d.message : '';
  $('name').disabled = start.disabled;
  $('name').hidden = !!active;
  const link = $('active-link');
  if (active) {
    link.hidden = false;
    link.innerHTML = `<span class="rec">REC</span> ${esc(d.activeRecordingName || active)}`;
    link.href = `#r=${encodeURIComponent(active)}`;
  } else {
    link.hidden = true;
  }
}

async function startCapture() {
  state.busy = true; renderTop();
  try {
    const r = await api('/api/capture/start', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name: $('name').value || null }) });
    $('name').value = '';
    await pollState();
    location.hash = `#r=${encodeURIComponent(r.id)}`;
  } catch (e) {
    alert(`could not start: ${e.message}`);
  } finally {
    state.busy = false; renderTop();
  }
}

async function stopCapture() {
  state.busy = true; renderTop();
  try {
    await api('/api/capture/stop', { method: 'POST' });
    await pollState();
    if (state.view === 'recording') await refreshRecording();
    else await renderHome();
  } catch (e) {
    alert(`could not stop: ${e.message}`);
  } finally {
    state.busy = false; renderTop();
  }
}

async function deleteRecording(id) {
  try {
    await api(`/api/recordings/${encodeURIComponent(id)}`, { method: 'DELETE' });
  } catch (e) {
    alert(`could not delete: ${e.message}`);
  }
  state.confirmDelete = null;
  if (state.view === 'recording' && state.recordingId === id) location.hash = '';
  else await renderHome();
}

/** A delete control with an inline confirmation, no dialog. */
function deleteControl(r, host) {
  host.innerHTML = '';
  if (r.active) return;
  if (state.confirmDelete === r.id) {
    const box = el('span', 'confirm');
    box.appendChild(document.createTextNode(`delete ${r.traceCount} trace${r.traceCount === 1 ? '' : 's'}?`));
    const yes = el('button', 'btn small danger', 'Delete');
    yes.addEventListener('click', (e) => { e.stopPropagation(); deleteRecording(r.id); });
    const no = el('button', 'btn small', 'Keep');
    no.addEventListener('click', (e) => { e.stopPropagation(); state.confirmDelete = null; deleteControl(r, host); });
    box.appendChild(yes); box.appendChild(no);
    host.appendChild(box);
  } else {
    const b = el('button', 'btn small', 'Delete');
    b.addEventListener('click', (e) => { e.stopPropagation(); state.confirmDelete = r.id; deleteControl(r, host); });
    host.appendChild(b);
  }
}

// ---- home: all recordings -------------------------------------------------------------------

async function renderHome() {
  const list = await api('/api/recordings');
  const body = $('home-body');
  body.innerHTML = '';
  body.className = '';
  if (!list.length) {
    body.appendChild(el('div', 'empty', 'No recordings yet. Start one above, then drive the application; Stop when done.'));
    return;
  }
  const table = el('table', 'recordings');
  table.innerHTML = '<thead><tr><th>recording</th><th>started</th><th>duration</th><th>traces</th><th>servers</th><th></th></tr></thead>';
  const tbody = el('tbody');
  for (const r of list) {
    const tr = el('tr', r.active ? 'active' : '');
    const duration = r.startedAt && r.endedAt ? fmtDuration(Date.parse(r.endedAt) - Date.parse(r.startedAt)) : (r.active ? 'running' : r.startedAt ? 'unfinished' : '');
    tr.innerHTML = `<td><a class="name" href="#r=${encodeURIComponent(r.id)}">${esc(r.name || r.id)}</a> ${r.active ? '<span class="rec">REC</span>' : ''}<div class="id">${esc(r.id)}</div></td>` +
      `<td>${esc(fmtTime(r.startedAt))}</td><td>${esc(duration)}</td><td>${r.traceCount}</td><td>${esc((r.servers || []).join(', '))}</td><td class="actions"></td>`;

// ---- recording view: loading ---------------------------------------------------------------------

async function openRecording(id, hash) {
  state.view = 'recording';
  if (state.recordingId !== id) {
    state.recordingId = id;
    state.index = null;
    state.traces = new Map();
    state.model = null;
    state.selectedTrace = null;
    state.selectedSpan = null;
    state.selectedGroup = null;
    state.expanded = new Map();
    $('win').hidden = true;
  }
  showView();
  try {
    await refreshRecording();
  } catch (e) {
    $('body').className = '';
    $('body').innerHTML = `<div class="err-box">${esc(String(e))}</div>`;
    return;
  }
  if (hash.get('t') && state.traces.has(hash.get('t'))) {
    if (hash.get('p')) jumpTo(hash.get('t'), hash.get('s') || rootOf(hash.get('t')), hash.get('p'));
    else selectSpan(hash.get('t'), hash.get('s') || rootOf(hash.get('t')));
  }
}

/** Reloads the index, fetches traces not seen yet, rebuilds the diagram when something changed. */
async function refreshRecording() {
  const id = state.recordingId;
  const index = await api(`/api/recordings/${encodeURIComponent(id)}`);
  if (state.recordingId !== id) return;
  const missing = index.traces.filter(t => !state.traces.has(t.id));
  const t0 = performance.now();
  await Promise.all(missing.map(async t => {
    const trace = await api(`/api/recordings/${encodeURIComponent(id)}/traces/${encodeURIComponent(t.file)}`);
    state.traces.set(t.id, trace);
  }));
  if (missing.length) console.info(`[capture] ${missing.length} trace(s), ${missing.reduce((n, t) => n + (t.spanCount || 0), 0)} spans fetched and parsed in ${(performance.now() - t0).toFixed(0)} ms`);
  if (state.recordingId !== id) return;
  const changed = !state.index || state.index.traces.length !== index.traces.length || missing.length > 0;
  state.index = index;
  const r = index.recording || {};
  const active = state.domain && state.domain.activeRecordingId === id;
  const entries = index.traces.filter(t => !t.parentTraceId || !state.traces.has(t.parentTraceId)).length;
  $('recording-meta').innerHTML = `<b>${esc(r.name || r.id || id)}</b> · ${esc(r.id || id)} · ${entries} entry point${entries === 1 ? '' : 's'} · ${index.traces.length} thread${index.traces.length === 1 ? '' : 's'} of work` +
    ` · ${esc((r.servers || [r.serverName]).filter(Boolean).join(', ') || '?')}` +
    (active ? ' · <span class="rec">REC</span> new work appears as it completes' : r.endedAt ? '' : ' · unfinished (no end recorded)');
  deleteControl({ id, active, traceCount: index.traces.length }, $('rec-delete'));
  if (changed) {
    const t1 = performance.now();
    state.model = buildModel();
    render();
    console.info(`[capture] diagram of ${state.model.rows.length} rows built and rendered in ${(performance.now() - t1).toFixed(0)} ms`);
    if (state.selectedTrace) renderDetail();
  }
}

// ---- routing & polling --------------------------------------------------------------------------

function showView() {
  $('home').hidden = state.view !== 'home';
  $('recording').hidden = state.view !== 'recording';
  if (state.view !== 'recording') $('win').hidden = true;
}

async function route() {
  const h = new URLSearchParams(location.hash.replace(/^#/, ''));
  if (h.get('r')) {
    await openRecording(h.get('r'), h);
  } else {
    state.view = 'home';
    showView();
    await renderHome();
  }
}

async function tick() {
  await pollState();
  try {
    if (state.view === 'home') await renderHome();
    else if (state.view === 'recording' && state.domain && state.domain.activeRecordingId === state.recordingId) await refreshRecording();
  } catch (e) {
    // transient while files are being written; the next tick retries
  }
}

window.addEventListener('hashchange', route);
$('btn-start').addEventListener('click', startCapture);
$('btn-stop').addEventListener('click', stopCapture);
$('name').addEventListener('keydown', e => { if (e.key === 'Enter' && !$('btn-start').disabled) startCapture(); });

function fmtTime(iso) { return iso ? iso.replace('T', ' ').replace(/\.\d+Z$/, 'Z') : ''; }
function fmtDuration(ms) { return ms < 1000 ? `${ms} ms` : ms < 60000 ? `${(ms / 1000).toFixed(1)} s` : `${Math.floor(ms / 60000)} min ${Math.round((ms % 60000) / 1000)} s`; }
function fmtNs(ns) { const ms = ns / 1e6; return ms < 10 ? `${ms.toFixed(2)} ms` : ms < 1000 ? `${ms.toFixed(1)} ms` : `${(ms / 1000).toFixed(2)} s`; }

(async () => { await pollState(); await route(); setInterval(tick, 1000); })();

// Markers the agent writes for structural necessities; each is highlighted, never hidden. Red
// means data is missing at this point; the others only tell what the value is.
const MARKERS = { '@type': 'type', '@ref': 'ref', '@id': 'ref', '@lazy': 'lazy', '@handle': 'handle', '@skipped': 'skipped', '@truncated': 'truncated', '@unserializable': 'unserializable', '@serializable': 'unserializable', '@bytes': 'type', '@text': 'truncated', '@jms': 'type', '@entries': 'type' };

  '@id': 'this object is referred to elsewhere by @ref',
  '@lazy': 'a lazy collection or holder that was not loaded when the call crossed the boundary; loading it would have changed the call, so its content is not here',
  '@handle': 'a runtime handle (thread, class loader, socket, connection, lock); not payload, so only its identity and toString are recorded',
  '@skipped': 'fields the walker leaves out because they describe the JVM, not the value (for example Throwable.backtrace)',
  '@truncated': 'a safety ceiling was hit: what and how much was dropped',
  '@unserializable': 'the walker could not read this value; the reason and its toString are recorded',
  '@serializable': 'false: the object does not implement Serializable. It was captured in full all the same; this only matters for replaying it',
  '@bytes': 'a byte array, base64',
  '@text': 'a string over the ceiling: what was kept, and how much was dropped',
  '@jms': 'a JMS message, recorded as headers, properties and body',
  '@entries': 'a map with non-string keys, as key/value pairs',

function renderValue(container, value, path, depth, badges, key) {
  const row = el('span', 'row');
  row.style.setProperty('--indent', depth ? '1.2em' : '0');  // rows nest, so each level adds one step
  row.dataset.path = path;
  if (key !== undefined) {
    const k = el('span', 'k', typeof key === 'number' ? `[${key}]` : JSON.stringify(key));
    const marker = typeof key === 'string' && Object.prototype.hasOwnProperty.call(MARKERS, key) ? MARKERS[key] : null;
    if (marker) { k.classList.add('m', marker); k.title = MARKER_HELP[key] || ''; }
    row.appendChild(k);
    row.appendChild(document.createTextNode(': '));
    if (MISSING.has(key) && value !== false) row.classList.add('flagged');
  }
  if (value === null || value === undefined) {
    row.appendChild(el('span', 'z', 'null'));
  } else if (Array.isArray(value)) {
    if (!value.length) row.appendChild(document.createTextNode('[]'));
    else {
      const fold = el('span', 'fold', `[ ${value.length} ]`);
      const box = el('span', 'block');
      fold.addEventListener('click', () => { box.hidden = !box.hidden; });
      row.appendChild(fold);
      row.appendChild(box);
      value.forEach((v, i) => renderValue(box, v, `${path}[${i}]`, depth + 1, badges, i));
    }
  } else if (typeof value === 'object') {
    const keys = Object.keys(value);
    if (!keys.length) row.appendChild(document.createTextNode('{}'));
    else {
      const fold = el('span', 'fold', `{ ${keys.length} }`);
      const box = el('span', 'block');
      fold.addEventListener('click', () => { box.hidden = !box.hidden; });
      row.appendChild(fold);
      row.appendChild(box);
      for (const k of keys) renderValue(box, value[k], path ? `${path}.${k}` : k, depth + 1, badges, k);
    }
  } else if (typeof value === 'string') {
    if (value.length > 120 || value.includes('\n')) {
      const block = el('span', 'text-block');
      block.textContent = value;
      row.appendChild(el('span', 'z', `string, ${value.length} chars`));
      row.appendChild(block);
    } else {
      row.appendChild(el('span', 's', JSON.stringify(value)));
    }
  } else if (typeof value === 'number') {
    row.appendChild(el('span', 'n', String(value)));
  } else {
    row.appendChild(el('span', 'b', String(value)));
  }
  const b = badges[path];
  if (b) { b.badges.forEach(x => row.appendChild(x)); b.placed = true; }
  container.appendChild(row);
}

function findRow(scope, path) {
  // exact first, then the longest rendered prefix (a value inside a body string, a path segment)
  let p = path;
  while (p) {
    const hit = scope.querySelector(`.row[data-path="${CSS.escape(p)}"]`);
    if (hit) return hit;
    p = parentPath(p);
  }
  return null;
}
function parentPath(p) { const i = Math.max(p.lastIndexOf('.'), p.lastIndexOf('[')); return i <= 0 ? '' : p.substring(0, i); }

// ---- lineage ----------------------------------------------------------------------------

// A lineage path names the captured value ("args[0].orderId", "result.id", "http.requestBody.x",
// "http.path[4]"); in the span JSON an arg or result wraps its value (args[0].value.orderId), and a
// value inside a body string or the URL is addressed from the field holding it, remainder shown.
function locate(lineagePath) {
  let m;
  if ((m = /^(args\[\d+\])(.*)$/.exec(lineagePath))) return { json: m[1] + '.value' + m[2], remainder: '' };
  if ((m = /^result(.*)$/.exec(lineagePath))) return { json: 'result.value' + m[1], remainder: '' };
  if ((m = /^(http\.(requestBody|responseBody|path|query))(.*)$/.exec(lineagePath))) return { json: m[1], remainder: m[3] };
  return { json: lineagePath, remainder: '' };
}
function jsonPath(lineagePath) { return locate(lineagePath).json; }

function lineageBadges(traceId, spanId) {
  const out = {};
  const put = (lineagePath, badgeEl) => { const jp = jsonPath(lineagePath); if (!out[jp]) out[jp] = { badges: [], placed: false }; out[jp].badges.push(badgeEl); };
  const seqOf = id => { const t = state.traces.get(id); return t && t.seq ? '#' + t.seq : (t && t.cause ? '#' + entryOf(t.cause).seq + '↓' : id); };
  const labelOf = (ref) => { const t = state.traces.get(ref.trace || traceId); const s = t && t.byId && t.byId.get(ref.span); return s ? spanLabel(s) : ref.span; };
  const link = (ref, text) => {
    const a = el('a', '', text);
    a.title = `${ref.trace || traceId} / ${ref.span} / ${ref.path}`;
    a.addEventListener('click', (e) => { e.stopPropagation(); jumpTo(ref.trace || traceId, ref.span, jsonPath(ref.path)); });
    return a;
  };
  for (const entry of state.index.lineage) {
    const to = entry.to || {};
    const toTrace = to.trace || traceId;
    if (toTrace === traceId && to.span === spanId) {
      const b = el('span', 'lineage');
      const remainder = locate(to.path).remainder;
      if (entry.from) {
        b.appendChild(document.createTextNode((remainder ? remainder + ' ' : '') + '← '));
        b.appendChild(link(entry.from, `${seqOf(entry.from.trace)} ${labelOf(entry.from)} / ${entry.from.path}`));
        for (const alt of entry.alternatives || []) {
          b.appendChild(document.createTextNode(' · '));
          const altLink = link(alt, `${seqOf(alt.trace)} ${labelOf(alt)} / ${alt.path}`);
          altLink.classList.add('alt');
          b.appendChild(document.createTextNode('also: '));
          b.appendChild(altLink);
        }
        if (entry.alsoProducedHere) b.appendChild(document.createTextNode(' · also produced in this trace'));
      } else {
        b.classList.add('class-' + entry.classification);
        b.textContent = (remainder ? remainder + ' ' : '') + entry.classification;
      }
      b.title = `value ${entry.value}`;
      put(to.path, b);
    }
    if (entry.from && (entry.from.trace || traceId) === traceId && entry.from.span === spanId) {
      const b = el('span', 'lineage uses');
      const remainder = locate(entry.from.path).remainder;
      b.appendChild(document.createTextNode((remainder ? remainder + ' ' : '') + '→ '));
      b.appendChild(link({ trace: toTrace, span: to.span, path: to.path }, `${seqOf(toTrace)} ${labelOf({ trace: toTrace, span: to.span })} / ${to.path}`));
      b.title = `value ${entry.value}`;
      put(entry.from.path, b);
    }
  }
  return out;
}

// ---- helpers ------------------------------------------------------------------------------

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
function shorten(s, n) { s = s || ''; return s.length > n ? s.substring(0, n) + '…' : s; }

</script>
