<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ejb-capture</title>
<style>
  :root {
    --bg: #f5f6f8; --panel: #ffffff; --fg: #111827; --muted: #6b7280; --line: #e5e7eb; --line-strong: #cbd5e1;
    --ejb: #4f46e5; --ejb-soft: #eef2ff; --http: #0f766e; --http-soft: #ecfdf5; --remote: #d97706; --remote-soft: #fffbeb;
    --err: #dc2626; --err-soft: #fef2f2; --handoff: #7c3aed; --handoff-soft: #f5f3ff; --group: #475569; --group-soft: #f1f5f9;
    --self: #0891b2; --trunc: #c2410c; --sel: #4f46e5; --sel-ring: rgba(79, 70, 229, .18);
    --marker: #fff7d6; --ref: #e6fffa; --lazy: #fefcbf; --handle: #fee2e2; --skipped: #e2e8f0; --type: #eef2ff; --flash: #fde68a;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, system-ui, sans-serif; color: var(--fg); background: var(--bg); }
  a { color: var(--ejb); }
  button { font: inherit; }
  .btn { border: 1px solid var(--line-strong); background: var(--panel); color: var(--fg); border-radius: 6px; padding: 4px 12px; cursor: pointer; }
  .btn:hover:not(:disabled) { border-color: #94a3b8; background: #f8fafc; }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn.primary { background: var(--ejb); border-color: var(--ejb); color: #fff; }
  .btn.primary:hover:not(:disabled) { background: #4338ca; }
  .btn.danger { color: var(--err); border-color: #fca5a5; }
  .btn.danger:hover:not(:disabled) { background: var(--err-soft); }
  .btn.small { padding: 1px 8px; font-size: 12px; }
  input[type=text] { font: inherit; border: 1px solid var(--line-strong); border-radius: 6px; padding: 4px 8px; background: var(--panel); }

  /* header */
  header .bar { display: flex; gap: 14px; align-items: center; padding: 8px 16px; border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
  .brand { font-weight: 700; letter-spacing: -.01em; color: var(--fg); text-decoration: none; font-size: 14px; }
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border-radius: 999px; border: 1px solid var(--line); font-size: 12px; background: #fff; }
  .pill::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: #94a3b8; }
  .pill.ok::before { background: #10b981; } .pill.warn::before { background: #f59e0b; } .pill.bad::before { background: var(--err); }
  .servers { display: inline-flex; gap: 6px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
  .servers .server { padding: 1px 8px; border-radius: 6px; border: 1px solid var(--line); background: #fff; color: var(--fg); }
  .servers .server.noagent { border-color: #fca5a5; background: var(--err-soft); }
  .servers .server.none { border-style: dashed; color: var(--muted); }
  .controls { margin-left: auto; display: inline-flex; gap: 8px; align-items: center; }
  .controls .reason { color: var(--muted); font-size: 12px; max-width: 480px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #active-link { font-size: 12px; }
  .rec { color: #fff; background: #ea580c; border-radius: 4px; padding: 0 6px; font-size: 11px; font-weight: 700; letter-spacing: .03em; }

  /* home */
  #home { padding: 18px 24px; max-width: 1200px; }
  #home h1 { font-size: 16px; margin: 0 0 4px; }
  #home .hint { color: var(--muted); margin: 0 0 14px; }
  table.recordings { border-collapse: collapse; width: 100%; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  table.recordings th, table.recordings td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  table.recordings tr:last-child td { border-bottom: none; }
  table.recordings th { color: var(--muted); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; background: #fafafa; }
  table.recordings tr.active td { background: #fff7ed; }
  table.recordings td.actions { text-align: right; white-space: nowrap; }
  table.recordings .name { font-weight: 600; }
  table.recordings .id { color: var(--muted); font-family: var(--mono); font-size: 12px; }
  .confirm { display: inline-flex; gap: 6px; align-items: center; color: var(--err); font-size: 12px; }
  .empty { color: var(--muted); padding: 20px; }
  .err-box { color: var(--err); padding: 20px; white-space: pre-wrap; }

  /* recording view */
  #recording .rec-bar { display: flex; gap: 12px; align-items: center; padding: 6px 16px; border-bottom: 1px solid var(--line); background: var(--panel); font-size: 12px; color: var(--muted); flex-wrap: wrap; }
  #recording .rec-bar b { color: var(--fg); }
  #recording .rec-bar .spacer { margin-left: auto; }
  #recording main { display: grid; grid-template-columns: 270px minmax(520px, 1.5fr) minmax(400px, 1fr); height: calc(100vh - 82px); }
  #recording main > section { overflow: auto; border-right: 1px solid var(--line); background: var(--bg); }
  #recording main > section:last-child { border-right: none; background: var(--panel); }
  h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0; padding: 10px 12px 6px; position: sticky; top: 0; background: inherit; z-index: 2; }

  /* traces (left) */
  .lane { margin: 0 8px 14px; }
  .lane-head { font-size: 11px; color: var(--muted); padding: 4px 6px; }
  .lane-head b { color: var(--fg); font-weight: 600; }
  .trace { display: grid; grid-template-columns: 30px 1fr auto; gap: 2px 6px; padding: 6px 8px; border-radius: 8px; cursor: pointer; border: 1px solid var(--line); background: var(--panel); margin-bottom: 4px; }
  .trace:hover { border-color: var(--line-strong); }
  .trace.selected { border-color: var(--sel); box-shadow: 0 0 0 3px var(--sel-ring); }
  .trace .seq { color: var(--muted); font-size: 12px; }
  .trace .label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
  .trace .dur { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 12px; }
  .trace .sub { grid-column: 2 / 4; color: var(--muted); font-size: 11px; }
  .trace.child { margin-left: 18px; border-left: 3px solid var(--handoff); }
  .trace .cause { color: var(--handoff); text-decoration: underline; cursor: pointer; }

  /* flow (centre) */
  #flow-head { padding: 4px 12px 8px; font-size: 12px; color: var(--muted); }
  #flow-head a { color: var(--handoff); cursor: pointer; }
  #flow-canvas { position: relative; margin: 0 12px 24px; }
  #flow-canvas svg { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
  .edge { fill: none; stroke: #94a3b8; stroke-width: 1.5; }
  .edge.remote { stroke: var(--remote); stroke-dasharray: 5 3; }
  .edge.ghost { stroke: var(--handoff); stroke-dasharray: 2 4; }
  .card { position: absolute; width: 236px; border-radius: 10px; background: var(--panel); border: 1px solid var(--line); box-shadow: 0 1px 2px rgba(15, 23, 42, .06); padding: 7px 10px 6px; cursor: pointer; overflow: hidden; }
  .card:hover { border-color: var(--line-strong); box-shadow: 0 2px 6px rgba(15, 23, 42, .10); }
  .card.selected { border-color: var(--sel); box-shadow: 0 0 0 3px var(--sel-ring); }
  .card.err { border-left: 3px solid var(--err); }
  .card.ghost { border-style: dashed; border-color: #c4b5fd; background: var(--handoff-soft); }
  .card.group { background: var(--group-soft); }
  .card.more { background: transparent; border-style: dashed; color: var(--muted); text-align: center; padding-top: 20px; }
  .card .l1 { display: flex; align-items: baseline; gap: 6px; }
  .card .label { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
  .card .dur { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 11.5px; white-space: nowrap; }
  .card .l2 { display: flex; gap: 4px; flex-wrap: nowrap; overflow: hidden; margin-top: 3px; min-height: 16px; align-items: center; }
  .card .track { height: 3px; background: #eef0f3; border-radius: 2px; margin-top: 6px; position: relative; }
  .card .track i { position: absolute; top: 0; height: 100%; border-radius: 2px; background: var(--ejb); }
  .card.kind-http .track i { background: var(--http); }
  .kbadge { font-size: 10px; font-weight: 700; letter-spacing: .04em; padding: 0 5px; border-radius: 4px; line-height: 15px; }
  .kbadge.ejb { color: var(--ejb); background: var(--ejb-soft); } .kbadge.http { color: var(--http); background: var(--http-soft); }
  .chip { display: inline-block; font-size: 10.5px; line-height: 15px; padding: 0 6px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); background: #fff; white-space: nowrap; }
  .chip.remote { color: var(--remote); border-color: #fcd34d; background: var(--remote-soft); font-weight: 600; }
  .chip.app { color: var(--fg); background: #f8fafc; }
  .chip.err { color: #fff; background: var(--err); border-color: var(--err); font-weight: 600; }
  .chip.status-ok { color: var(--http); border-color: #6ee7b7; }
  .chip.status-err { color: var(--err); border-color: #fca5a5; }
  .chip.self { color: var(--self); border-color: #67e8f9; }
  .chip.trunc { color: #fff; background: var(--trunc); border-color: var(--trunc); }
  .chip.warn { color: var(--trunc); border-color: #fdba74; }
  .chip.fold { color: var(--fg); border-color: var(--line-strong); cursor: pointer; font-weight: 600; }
  .chip.fold:hover { background: #f1f5f9; }
  .chip.count { color: var(--group); background: #fff; border-color: #94a3b8; font-weight: 700; cursor: pointer; }
  .chip.handoff { color: var(--handoff); border-color: #c4b5fd; background: var(--handoff-soft); font-weight: 600; }
  .chip.tx { color: var(--muted); }

  /* detail (right) */
  #detail-body { padding: 0 14px 24px; }
  .d-head h3 { margin: 6px 0 4px; font-size: 15px; letter-spacing: -.01em; }
  .d-head .chips { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 8px; }
  .facts { display: grid; grid-template-columns: max-content 1fr; gap: 2px 12px; font-size: 12px; margin-bottom: 10px; }
  .facts dt { color: var(--muted); } .facts dd { margin: 0; font-family: var(--mono); font-size: 11.5px; word-break: break-all; }
  .facts dd.plain { font-family: inherit; font-size: 12px; }
  details.sec { border-top: 1px solid var(--line); padding: 6px 0; }
  details.sec > summary { cursor: pointer; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; padding: 4px 0; list-style: none; display: flex; gap: 8px; align-items: center; }
  details.sec > summary::before { content: '▸'; color: var(--muted); font-size: 10px; } details.sec[open] > summary::before { content: '▾'; }
  details.sec > summary .n { font-weight: 400; text-transform: none; letter-spacing: 0; }
  .handoff-box { margin: 6px 0; font-size: 12px; background: var(--handoff-soft); border: 1px solid #ddd6fe; border-radius: 6px; padding: 4px 8px; }
  .handoff-box a { color: var(--handoff); cursor: pointer; text-decoration: underline; }
  .group-table { width: 100%; border-collapse: collapse; font-size: 12px; font-variant-numeric: tabular-nums; }
  .group-table td, .group-table th { padding: 2px 6px; border-bottom: 1px solid var(--line); text-align: left; }
  .group-table tr { cursor: pointer; } .group-table tr:hover td { background: #f8fafc; }
  .group-table tr.selected td { background: var(--ejb-soft); }
  .json { font: 12px/1.45 var(--mono); white-space: pre-wrap; word-break: break-word; }
  .json .row { display: block; padding-left: var(--indent, 0); }
  .json .k { color: #475569; } .json .s { color: #1d4ed8; } .json .n { color: #7c3aed; } .json .b { color: #b45309; } .json .z { color: var(--muted); }
  .json .m { background: var(--marker); border-radius: 2px; padding: 0 2px; }
  .json .m.type { background: var(--type); } .json .m.ref { background: var(--ref); } .json .m.lazy { background: var(--lazy); }
  .json .m.handle { background: var(--handle); } .json .m.skipped { background: var(--skipped); } .json .m.truncated { background: #fbd38d; } .json .m.unserializable { background: var(--handle); }
  .json .row.flagged { outline: 2px solid var(--err); outline-offset: -1px; background: var(--err-soft); }
  .json .row.flash { animation: flash 1.6s ease-out; }
  @keyframes flash { 0% { background: var(--flash); } 100% { background: transparent; } }
  .json .fold { cursor: pointer; color: var(--muted); user-select: none; }
  .json .text-block { display: block; margin: 2px 0 2px 1em; padding: 4px 6px; background: #f8fafc; border: 1px solid var(--line); border-radius: 4px; max-height: 320px; overflow: auto; white-space: pre-wrap; }
  .lineage { display: inline-block; margin-left: 8px; font: 11px system-ui, sans-serif; background: #ffedd5; border: 1px solid #fdba74; border-radius: 4px; padding: 0 5px; vertical-align: baseline; }
  .lineage a { color: #9a3412; text-decoration: underline; cursor: pointer; }
  .lineage .alt { color: var(--muted); }
  .lineage.class-userInput { background: #ccfbf1; border-color: #5eead4; }
  .lineage.class-environment { background: #f1f5f9; border-color: #cbd5e1; }
  .lineage.uses { background: #dbeafe; border-color: #93c5fd; }
  .keys { font-size: 11px; color: var(--muted); }
</style>
</head>
<body>
<header>
  <div class="bar">
    <a id="nav-home" class="brand" href="#">ejb-capture</a>
    <span id="state-message" class="pill">…</span>
    <span id="servers" class="servers"></span>
    <span class="controls">
      <a id="active-link" hidden></a>
      <input id="name" type="text" placeholder="recording name (optional)" size="22">
      <button id="btn-start" class="btn primary" disabled>Start</button>
      <button id="btn-stop" class="btn" disabled>Stop</button>
      <span id="start-reason" class="reason"></span>
    </span>
  </div>
</header>
<section id="home">
  <h1>Recordings</h1>
  <p id="domain-meta" class="hint"></p>
  <div id="home-body" class="empty">loading…</div>
</section>
<section id="recording" hidden>
  <div class="rec-bar">
    <a href="#">‹ recordings</a>
    <span id="recording-meta"></span>
    <span class="spacer"></span>
    <span id="rec-delete"></span>
    <span class="keys">↑/↓ trace · ←/→ fold/unfold the selected call</span>
  </div>
  <main>
    <section id="traces"><h2>Traces</h2><div id="lanes"></div></section>
    <section id="flow"><h2>Call flow</h2><div id="flow-head"></div><div id="flow-canvas" class="empty">Select a trace.</div></section>
    <section id="detail"><h2>Call</h2><div id="detail-body" class="empty">Select a call.</div></section>
  </main>
</section>
<script>
'use strict';

// ---- state --------------------------------------------------------------------------------

const state = {
  domain: null,            // last /api/state
  view: 'home',            // 'home' | 'recording'
  recordingId: null,
  index: null,             // /api/recordings/{id}
  traces: new Map(),       // trace id -> trace JSON (kept across index refreshes)
  order: [],               // trace ids in index order
  selectedTrace: null,
  selectedSpan: null,
  selectedGroup: null,     // a grouped run's key, when the group card itself is selected
  collapsed: new Set(),    // "traceId/spanId": descendants folded
  expanded: new Map(),     // group key -> how many of its calls are shown individually
  confirmDelete: null,     // recording id whose delete is awaiting confirmation
  busy: false,
};

const $ = id => document.getElementById(id);

async function api(path, options) {
  const r = await fetch(path, Object.assign({ cache: 'no-store' }, options || {}));
  const text = await r.text();
  let body = null;
  try { body = text ? JSON.parse(text) : null; } catch (e) { body = { error: text }; }
  if (!r.ok) throw new Error(body && body.error ? body.error : `${r.status} ${path}`);
  return body;
}

// ---- header: state, servers, start/stop --------------------------------------------------

async function pollState() {
  try {
    state.domain = await api('/api/state');
    renderTop();
  } catch (e) {
    $('state-message').textContent = `page server unreachable: ${e.message}`;
    $('state-message').className = 'pill bad';
    $('btn-start').disabled = true;
    $('btn-stop').disabled = true;
  }
}

function renderTop() {
  const d = state.domain;
  const msg = $('state-message');
  msg.textContent = d.message;
  msg.className = 'pill ' + (d.kind === 'READY' ? 'ok' : d.kind === 'ENABLED_SERVER_DOWN' ? 'warn' : 'bad');
  $('domain-meta').textContent = `${d.domain} · WebLogic ${d.webLogicVersion} · recordings in ${d.outDir}`;
  const servers = $('servers');
  servers.innerHTML = '';
  if (!d.servers.length) servers.appendChild(el('span', 'server none', 'no server JVM of this domain is running'));
  for (const s of d.servers) {
    const span = el('span', 'server ' + (s.agentLoaded ? 'agent' : 'noagent'));
    span.textContent = `${s.serverName} · pid ${s.pid} · ` + (s.agentLoaded
      ? (s.recording ? `recording ${s.traceCount} trace${s.traceCount === 1 ? '' : 's'}${s.droppedTraces ? ', ' + s.droppedTraces + ' dropped' : ''}` : 'agent idle')
      : 'no agent, restart it');
    if (s.agentLoaded && !s.agentCurrent) span.textContent += ' · older agent build; restart to update';
    span.title = s.agentBuild ? `agent ${s.agentBuild}` : '';
    servers.appendChild(span);
  }
  const active = d.activeRecordingId;
  const start = $('btn-start');
  const stop = $('btn-stop');
  start.disabled = state.busy || !d.ready || !!active;
  stop.disabled = state.busy || !active;
  $('start-reason').textContent = start.disabled && !state.busy && !active ? d.message : '';
  $('name').disabled = start.disabled;
  $('name').hidden = !!active;
  const link = $('active-link');
  if (active) {
    link.hidden = false;
    link.innerHTML = `<span class="rec">REC</span> ${esc(d.activeRecordingName || active)}`;
    link.href = `#r=${encodeURIComponent(active)}`;
  } else {
    link.hidden = true;
  }
}

async function startCapture() {
  state.busy = true; renderTop();
  try {
    const r = await api('/api/capture/start', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name: $('name').value || null }) });
    $('name').value = '';
    await pollState();
    location.hash = `#r=${encodeURIComponent(r.id)}`;
  } catch (e) {
    alert(`could not start: ${e.message}`);
  } finally {
    state.busy = false; renderTop();
  }
}

async function stopCapture() {
  state.busy = true; renderTop();
  try {
    await api('/api/capture/stop', { method: 'POST' });
    await pollState();
    if (state.view === 'recording') await refreshRecording();
    else await renderHome();
  } catch (e) {
    alert(`could not stop: ${e.message}`);
  } finally {
    state.busy = false; renderTop();
  }
}

async function deleteRecording(id) {
  try {
    await api(`/api/recordings/${encodeURIComponent(id)}`, { method: 'DELETE' });
  } catch (e) {
    alert(`could not delete: ${e.message}`);
  }
  state.confirmDelete = null;
  if (state.view === 'recording' && state.recordingId === id) location.hash = '';
  else await renderHome();
}

/** A delete control with an inline confirmation, no dialog. */
function deleteControl(r, host) {
  host.innerHTML = '';
  if (r.active) return;
  if (state.confirmDelete === r.id) {
    const box = el('span', 'confirm');
    box.appendChild(document.createTextNode(`delete ${r.traceCount} trace${r.traceCount === 1 ? '' : 's'}?`));
    const yes = el('button', 'btn small danger', 'Delete');
    yes.addEventListener('click', (e) => { e.stopPropagation(); deleteRecording(r.id); });
    const no = el('button', 'btn small', 'Keep');
    no.addEventListener('click', (e) => { e.stopPropagation(); state.confirmDelete = null; deleteControl(r, host); });
    box.appendChild(yes); box.appendChild(no);
    host.appendChild(box);
  } else {
    const b = el('button', 'btn small', 'Delete');
    b.addEventListener('click', (e) => { e.stopPropagation(); state.confirmDelete = r.id; deleteControl(r, host); });
    host.appendChild(b);
  }
}

// ---- home: all recordings -------------------------------------------------------------------

async function renderHome() {
  const list = await api('/api/recordings');
  const body = $('home-body');
  body.innerHTML = '';
  body.className = '';
  if (!list.length) {
    body.appendChild(el('div', 'empty', 'No recordings yet. Start one above, then drive the application; Stop when done.'));
    return;
  }
  const table = el('table', 'recordings');
  table.innerHTML = '<thead><tr><th>recording</th><th>started</th><th>duration</th><th>traces</th><th>servers</th><th></th></tr></thead>';
  const tbody = el('tbody');
  for (const r of list) {
    const tr = el('tr', r.active ? 'active' : '');
    const duration = r.startedAt && r.endedAt ? fmtDuration(Date.parse(r.endedAt) - Date.parse(r.startedAt)) : (r.active ? 'running' : r.startedAt ? 'unfinished' : '');
    tr.innerHTML = `<td><a class="name" href="#r=${encodeURIComponent(r.id)}">${esc(r.name || r.id)}</a> ${r.active ? '<span class="rec">REC</span>' : ''}<div class="id">${esc(r.id)}</div></td>` +
      `<td>${esc(fmtTime(r.startedAt))}</td><td>${esc(duration)}</td><td>${r.traceCount}</td><td>${esc((r.servers || []).join(', '))}</td><td class="actions"></td>`;
    deleteControl(r, tr.querySelector('.actions'));
    tbody.appendChild(tr);
  }
  table.appendChild(tbody);
  body.appendChild(table);
}

// ---- recording view -----------------------------------------------------------------------------

async function openRecording(id, hash) {
  state.view = 'recording';
  if (state.recordingId !== id) {
    state.recordingId = id;
    state.index = null;
    state.traces = new Map();
    state.order = [];
    state.selectedTrace = null;
    state.selectedSpan = null;
    state.selectedGroup = null;
    state.collapsed = new Set();
    state.expanded = new Map();
  }
  showView();
  try {
    await refreshRecording();
  } catch (e) {
    $('lanes').innerHTML = `<div class="err-box">${esc(String(e))}</div>`;
    return;
  }
  const wanted = hash.get('t') && state.traces.has(hash.get('t')) ? hash.get('t') : (state.selectedTrace || state.order[0]);
  if (wanted) {
    if (hash.get('p')) jumpTo(wanted, hash.get('s') || rootOf(wanted), hash.get('p'));
    else selectTrace(wanted, hash.get('s') || undefined);
  }
}

/** Reloads the index, fetches traces not seen yet, re-renders the lanes keeping the selection. */
async function refreshRecording() {
  const id = state.recordingId;
  const index = await api(`/api/recordings/${encodeURIComponent(id)}`);
  if (state.recordingId !== id) return;
  const ordered = index.traces.slice();
  const missing = ordered.filter(t => !state.traces.has(t.id));
  const t0 = performance.now();
  await Promise.all(missing.map(async t => {
    const trace = await api(`/api/recordings/${encodeURIComponent(id)}/traces/${encodeURIComponent(t.file)}`);
    state.traces.set(t.id, trace);
  }));
  if (missing.length) console.info(`[capture] ${missing.length} trace(s), ${missing.reduce((n, t) => n + (t.spanCount || 0), 0)} spans fetched and parsed in ${(performance.now() - t0).toFixed(0)} ms`);
  if (state.recordingId !== id) return;
  const changed = !state.index || state.index.traces.length !== ordered.length || missing.length > 0;
  state.index = index;
  state.order = ordered.map(t => t.id);
  const r = index.recording || {};
  const active = state.domain && state.domain.activeRecordingId === id;
  $('recording-meta').innerHTML = `<b>${esc(r.name || r.id || id)}</b> · ${esc(r.id || id)} · ${index.traces.length} trace${index.traces.length === 1 ? '' : 's'} · ${index.sessions.length} session${index.sessions.length === 1 ? '' : 's'}` +
    ` · ${esc((r.servers || [r.serverName]).filter(Boolean).join(', ') || '?')}` +
    (active ? ' · <span class="rec">REC</span> new traces appear as they complete' : r.endedAt ? '' : ' · unfinished (no end recorded)');
  deleteControl({ id, active, traceCount: index.traces.length }, $('rec-delete'));
  if (changed) {
    renderLanes();
    if (state.selectedTrace && state.traces.has(state.selectedTrace)) {
      document.querySelectorAll('.trace').forEach(x => x.classList.toggle('selected', x.dataset.trace === state.selectedTrace));
      if (missing.length) {
        // a handoff or lineage may now point into a trace that just landed: redraw, keep the selection
        renderFlow();
        renderDetail();
      }
    } else if (state.order.length) {
      selectTrace(state.order[state.order.length - 1]);
    }
  }
}

// ---- routing & polling --------------------------------------------------------------------------

function showView() {
  $('home').hidden = state.view !== 'home';
  $('recording').hidden = state.view !== 'recording';
}

async function route() {
  const h = new URLSearchParams(location.hash.replace(/^#/, ''));
  if (h.get('r')) {
    await openRecording(h.get('r'), h);
  } else {
    state.view = 'home';
    showView();
    await renderHome();
  }
}

async function tick() {
  await pollState();
  try {
    if (state.view === 'home') await renderHome();
    else if (state.view === 'recording' && state.domain && state.domain.activeRecordingId === state.recordingId) await refreshRecording();
  } catch (e) {
    // transient while files are being written; the next tick retries
  }
}

window.addEventListener('hashchange', route);
$('btn-start').addEventListener('click', startCapture);
$('btn-stop').addEventListener('click', stopCapture);
$('name').addEventListener('keydown', e => { if (e.key === 'Enter' && !$('btn-start').disabled) startCapture(); });

function fmtTime(iso) { return iso ? iso.replace('T', ' ').replace(/\.\d+Z$/, 'Z') : ''; }
function fmtDuration(ms) { return ms < 1000 ? `${ms} ms` : ms < 60000 ? `${(ms / 1000).toFixed(1)} s` : `${Math.floor(ms / 60000)} min ${Math.round((ms % 60000) / 1000)} s`; }
function fmtNs(ns) { const ms = ns / 1e6; return ms < 10 ? `${ms.toFixed(2)} ms` : ms < 1000 ? `${ms.toFixed(1)} ms` : `${(ms / 1000).toFixed(2)} s`; }

(async () => { await pollState(); await route(); setInterval(tick, 1000); })();

// ---- left: traces by session ------------------------------------------------------------

function renderLanes() {
  const lanes = $('lanes');
  lanes.innerHTML = '';
  const byId = new Map(state.index.traces.map(t => [t.id, t]));
  for (const session of state.index.sessions) {
    const lane = el('div', 'lane');
    const head = el('div', 'lane-head');
    head.innerHTML = `<b>${esc(session.kind)}</b> ${esc(shorten(session.key, 26))} · ${session.traceIds.length} trace${session.traceIds.length === 1 ? '' : 's'}`;
    head.title = session.key || '';
    lane.appendChild(head);
    for (const id of session.traceIds) {
      const t = byId.get(id);
      if (!t) continue;
      const row = el('div', 'trace' + (t.parentTraceId ? ' child' : ''));
      row.dataset.trace = id;
      const parent = t.parentTraceId ? byId.get(t.parentTraceId) : null;
      row.innerHTML = `<span class="seq">${t.parentTraceId ? '↳ ' : ''}#${t.seq}</span><span class="label">${esc(t.rootLabel || '?')}</span><span class="dur">${t.durationMs} ms</span>` +
        `<span class="sub">${esc(fmtTime(t.startedAt))}${t.principal ? ' · ' + esc(t.principal) : ''} · ${t.spanCount} call${t.spanCount === 1 ? '' : 's'}${t.failed ? ' · <span class="chip err">failed</span>' : ''}` +
        `${t.warningCount ? ' · ' + t.warningCount + ' note' + (t.warningCount === 1 ? '' : 's') : ''}</span>`;
      if (t.parentTraceId) {
        const sub = row.querySelector('.sub');
        sub.appendChild(document.createTextNode(' · from '));
        const a = el('a', 'cause', `${parent ? '#' + parent.seq : t.parentTraceId}${t.parentSpanId ? ' / ' + t.parentSpanId : ''}`);
        a.title = 'the call that handed this work to another thread';
        a.addEventListener('click', (e) => { e.stopPropagation(); if (parent) jumpTo(t.parentTraceId, t.parentSpanId || rootOf(t.parentTraceId)); });
        sub.appendChild(a);
      }
      row.title = t.id;
      row.addEventListener('click', () => selectTrace(id));
      lane.appendChild(row);
    }
    lanes.appendChild(lane);
  }
}

function selectTrace(id, spanId) {
  state.selectedTrace = id;
  state.selectedGroup = null;
  document.querySelectorAll('.trace').forEach(r => r.classList.toggle('selected', r.dataset.trace === id));
  const row = document.querySelector(`.trace[data-trace="${CSS.escape(id)}"]`);
  if (row) row.scrollIntoView({ block: 'nearest' });
  state.selectedSpan = spanId || rootOf(id);
  const t0 = performance.now();
  renderFlow();
  console.info(`[capture] flow of ${state.traces.get(id).spans.length} calls rendered in ${(performance.now() - t0).toFixed(0)} ms`);
  selectSpan(state.selectedSpan);
}

function rootOf(traceId) {
  const t = state.traces.get(traceId);
  const r = t.spans.find(s => s.parentId == null) || t.spans[0];
  return r && r.id;
}

// ---- centre: the call flow --------------------------------------------------------------

const CARD_W = 236, CARD_H = 66, COL_GAP = 40, ROW_GAP = 10, GROUP_MIN = 4, PAGE = 100;

function spanLabel(s) {
  if (s.ejb) return `${s.ejb.beanName || simple(s.ejb.beanClass)}.${s.ejb.method}`;
  if (s.http) {
    if (s.layer && s.http.resourceClass) return `${simple(s.http.resourceClass)}.${s.http.resourceMethod}`;
    return `${s.http.method || ''} ${s.http.path || ''}`;
  }
  return s.kind || '?';
}

function truncation(s) {
  const reasons = [];
  if (s.http) {
    if (s.http.requestBodyDropped) reasons.push(`request body: ${s.http.requestBodyDropped} bytes dropped`);
    if (s.http.responseBodyDropped) reasons.push(`response body: ${s.http.responseBodyDropped} bytes dropped`);
    if (s.http.requestBodyComplete === false) reasons.push('request body incomplete');
  }
  for (const w of s.serializationWarnings || []) {
    if (/limit|truncat|dropped/i.test(w.reason || '')) reasons.push(`${w.path}: ${w.reason}`);
  }
  let found = false;
  walk(s.args, v => { if (v && typeof v === 'object' && '@truncated' in v) found = true; });
  walk(s.result, v => { if (v && typeof v === 'object' && '@truncated' in v) found = true; });
  if (found) reasons.push('@truncated marker in args/result');
  return reasons;
}

function walk(v, fn) {
  if (v == null) return;
  fn(v);
  if (Array.isArray(v)) v.forEach(x => walk(x, fn));
  else if (typeof v === 'object') Object.values(v).forEach(x => walk(x, fn));
}

/** Traces this trace caused on other threads, by the causing span. */
function handoffsOf(traceId) {
  const out = new Map();
  for (const t of state.index.traces) {
    if (t.parentTraceId !== traceId) continue;
    const span = t.parentSpanId || rootOf(traceId);
    (out.get(span) || out.set(span, []).get(span)).push(t);
  }
  return out;
}

/**
 * The flow's nodes: one per call, in call order, children to the right of their caller.
 * A run of GROUP_MIN or more consecutive sibling calls of the same method that called nothing
 * further and did not fail is one "×N" node until expanded (in pages of PAGE); nothing is
 * dropped, the node says what it stands for and each call is still reachable. A trace this
 * call handed to another thread appears as a dashed node pointing at it.
 */
function buildFlow(trace) {
  const byId = new Map(trace.spans.map(s => [s.id, s]));
  const children = new Map();
  const roots = [];
  for (const s of trace.spans) {
    if (s.parentId == null || !byId.has(s.parentId)) roots.push(s);
    else (children.get(s.parentId) || children.set(s.parentId, []).get(s.parentId)).push(s);
  }
  for (const list of children.values()) list.sort((a, b) => a.order - b.order);
  const handoffs = handoffsOf(trace.trace.id);
  const tid = trace.trace.id;
  const groupable = s => !children.has(s.id) && !s.exception && !handoffs.has(s.id);
  const descendants = s => (children.get(s.id) || []).reduce((n, c) => n + 1 + descendants(c), 0);

  const mk = (span) => {
    const key = `${tid}/${span.id}`;
    const node = { span, key, kids: [], collapsed: state.collapsed.has(key), calls: descendants(span) };
    if (!node.collapsed) {
      const kids = children.get(span.id) || [];
      for (let i = 0; i < kids.length;) {
        const label = spanLabel(kids[i]);
        let j = i;
        while (j < kids.length && groupable(kids[j]) && spanLabel(kids[j]) === label) j++;
        if (j - i >= GROUP_MIN) {
          const run = kids.slice(i, j);
          const gkey = `${tid}/${run[0].id}+${run.length}`;
          const shown = state.expanded.get(gkey) || 0;
          if (shown === 0) {
            node.kids.push({ group: run, key: gkey, label, kids: [] });
          } else {
            run.slice(0, shown).forEach(s => node.kids.push(mk(s)));
            node.kids.push({ more: { key: gkey, shown: Math.min(shown, run.length), total: run.length }, key: gkey + '/more', kids: [] });
          }
          i = j;
        } else {
          node.kids.push(mk(kids[i]));
          i++;
        }
      }
      for (const t of handoffs.get(span.id) || []) node.kids.push({ ghost: t, key: `${key}/${t.id}`, kids: [] });
    }
    return node;
  };
  return roots.map(mk);
}

function measure(node) {
  node.h = node.kids.length ? Math.max(CARD_H, node.kids.reduce((h, k) => h + measure(k) + ROW_GAP, -ROW_GAP)) : CARD_H;
  return node.h;
}

function place(node, x, y, out) {
  node.x = x; node.y = y;
  out.push(node);
  let cy = y;
  for (const k of node.kids) { place(k, x + CARD_W + COL_GAP, cy, out); k.parent = node; cy += k.h + ROW_GAP; }
}

function renderFlow() {
  const canvas = $('flow-canvas');
  const head = $('flow-head');
  canvas.className = '';
  canvas.innerHTML = '';
  head.innerHTML = '';
  const trace = state.traces.get(state.selectedTrace);
  if (!trace) return;
  const summary = state.index.traces.find(t => t.id === trace.trace.id) || {};
  const root = trace.spans.find(s => s.parentId == null) || trace.spans[0];
  head.textContent = `#${summary.seq} · ${trace.spans.length} call${trace.spans.length === 1 ? '' : 's'} · ${trace.trace.durationMs} ms · ${shortThread(root.thread)}${trace.trace.principal ? ' · ' + trace.trace.principal : ''}`;
  if (trace.trace.parentTraceId) {
    const parent = state.index.traces.find(t => t.id === trace.trace.parentTraceId);
    head.appendChild(document.createTextNode(' · ← handed over from '));
    const a = el('a', '', parent ? `#${parent.seq} ${parent.rootLabel}${trace.trace.parentSpanId ? ' / ' + trace.trace.parentSpanId : ''}` : trace.trace.parentTraceId);
    a.title = 'another thread of this server (@Asynchronous or JMS) started this trace';
    if (parent) a.addEventListener('click', () => jumpTo(parent.id, trace.trace.parentSpanId || rootOf(parent.id)));
    head.appendChild(a);
  }

  const nodes = [];
  const roots = buildFlow(trace);
  let y = 0;
  for (const r of roots) { measure(r); place(r, 0, y, nodes); y += r.h + ROW_GAP; }
  const width = nodes.reduce((w, n) => Math.max(w, n.x + CARD_W), 0);
  const height = Math.max(0, y - ROW_GAP);
  canvas.style.width = width + 'px';
  canvas.style.height = height + 'px';

  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('width', width); svg.setAttribute('height', height);
  svg.innerHTML = '<defs>' + ['#94a3b8', '#d97706', '#7c3aed'].map((c, i) =>
    `<marker id="arr${i}" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L7,4 L0,7 z" fill="${c}"/></marker>`).join('') + '</defs>';
  for (const n of nodes) {
    if (!n.parent) continue;
    const p = n.parent;
    const x1 = p.x + CARD_W, y1 = p.y + CARD_H / 2, x2 = n.x, y2 = n.y + CARD_H / 2, xm = x1 + COL_GAP / 2;
    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    const kind = n.ghost ? 'ghost' : (n.span && n.span.ejb && n.span.ejb.invocation === 'REMOTE') || (n.group && n.group[0].ejb && n.group[0].ejb.invocation === 'REMOTE') ? 'remote' : '';
    path.setAttribute('d', y1 === y2 ? `M${x1},${y1} H${x2}` : `M${x1},${y1} H${xm} V${y2} H${x2}`);
    path.setAttribute('class', 'edge ' + kind);
    path.setAttribute('marker-end', `url(#arr${kind === 'ghost' ? 2 : kind === 'remote' ? 1 : 0})`);
    svg.appendChild(path);
  }
  canvas.appendChild(svg);

  const rootStart = root.startNs, rootDur = Math.max(1, root.durationNs);
  for (const n of nodes) canvas.appendChild(card(n, trace, rootStart, rootDur));
  markSelection();
}

function card(n, trace, rootStart, rootDur) {
  const c = el('div', 'card');
  c.style.left = n.x + 'px'; c.style.top = n.y + 'px';
  if (n.more) {
    c.classList.add('more');
    const remaining = n.more.total - n.more.shown;
    c.textContent = remaining > 0 ? `${n.more.shown} of ${n.more.total} shown · show ${Math.min(PAGE * 5, remaining)} more` : `all ${n.more.total} shown · fold back into one`;
    c.addEventListener('click', () => {
      if (remaining > 0) state.expanded.set(n.more.key, n.more.shown + PAGE * 5); else state.expanded.delete(n.more.key);
      renderFlow();
    });
    return c;
  }
  if (n.ghost) {
    const t = n.ghost;
    c.classList.add('ghost');
    c.innerHTML = `<div class="l1"><span class="chip handoff">⇢ thread</span><span class="label">#${t.seq} ${esc(t.rootLabel || '')}</span><span class="dur">${t.durationMs} ms</span></div>` +
      `<div class="l2"><span class="chip">${t.spanCount} call${t.spanCount === 1 ? '' : 's'}</span>${t.failed ? '<span class="chip err">failed</span>' : ''}<span class="chip">continues on another thread</span></div>`;
    c.title = `${t.id}: started by this call on another thread (@Asynchronous or JMS); click to open`;
    c.addEventListener('click', () => jumpTo(t.id, rootOf(t.id)));
    return c;
  }
  const s = n.group ? n.group[0] : n.span;
  const kind = s.kind === 'EJB' ? 'ejb' : 'http';
  c.classList.add('kind-' + kind);
  c.dataset.span = n.group ? '' : s.id;
  if (n.group) c.dataset.group = n.key;
  const l1 = el('div', 'l1');
  l1.appendChild(el('span', 'kbadge ' + kind, s.kind));
  const label = el('span', 'label', spanLabel(s));
  label.title = spanLabel(s);
  l1.appendChild(label);
  c.appendChild(l1);
  const total = n.group ? n.group.reduce((a, g) => a + g.durationNs, 0) : s.durationNs;
  const l2 = el('div', 'l2');
  const chip = (cls, text, title) => { const x = el('span', 'chip ' + cls, text); if (title) x.title = title; l2.appendChild(x); return x; };
  l2.appendChild(el('span', 'dur', fmtNs(total)));
  if (n.group) {
    c.classList.add('group');
    const x = chip('count', `×${n.group.length}`, `${n.group.length} consecutive calls of ${spanLabel(s)}, none calling further, none failing; shown as one. Click to see them one by one.`);
    x.addEventListener('click', (e) => { e.stopPropagation(); state.expanded.set(n.key, PAGE); renderFlow(); });
    chip('', `avg ${fmtNs(total / n.group.length)}`);
  }
  if (s.layer) chip('', s.layer);
  if (s.ejb && s.ejb.invocation === 'REMOTE') chip('remote', 'REMOTE', `through ${s.ejb.interface || 'the remote view'}`);
  if (s.ejb && s.ejb.invocation === 'MESSAGE') chip('handoff', 'JMS', s.ejb.destination || '');
  const parentApp = n.parent && (n.parent.span || (n.parent.group && n.parent.group[0]));
  if (s.app && (!parentApp || parentApp.app !== s.app)) chip('app', s.app, `${s.app}${s.module ? ' / ' + s.module : ''}`);
  if (s.http && s.http.status != null && !s.layer) chip(s.http.status >= 400 ? 'status-err' : 'status-ok', String(s.http.status));
  if (s.exception) { c.classList.add('err'); chip('err', `✗ ${simple(s.exception.className)}`, s.exception.message || ''); }
  if (s.selfInvocation) chip('self', 'self', 'the bean called itself through the container');
  const trunc = n.group ? [] : truncation(s);
  if (trunc.length) chip('trunc', 'truncated', trunc.join('\n'));
  else if (!n.group && (s.serializationWarnings || []).length) chip('warn', `${s.serializationWarnings.length} note${s.serializationWarnings.length === 1 ? '' : 's'}`, s.serializationWarnings.map(w => `${w.path}: ${w.reason}`).join('\n'));
  if (!n.group && n.calls) {
    const x = chip('fold', `${n.collapsed ? '▸' : '▾'} ${n.calls}`, `${n.calls} call${n.calls === 1 ? '' : 's'} made from here: click to ${n.collapsed ? 'unfold' : 'fold'}`);
    x.addEventListener('click', (e) => { e.stopPropagation(); toggleCollapse(n.key); });
  }
  c.appendChild(l2);
  const track = el('div', 'track');
  const bar = el('i');
  const start = n.group ? n.group[0].startNs : s.startNs;
  const end = n.group ? n.group[n.group.length - 1].startNs + n.group[n.group.length - 1].durationNs : s.startNs + s.durationNs;
  bar.style.left = `${Math.min(99, Math.max(0, (start - rootStart) / rootDur * 100))}%`;
  bar.style.width = `${Math.max(0.8, (end - start) / rootDur * 100)}%`;
  track.title = `started ${fmtNs(start - rootStart)} into the trace`;
  track.appendChild(bar);
  c.appendChild(track);
  c.title = n.group ? `${n.group.length} × ${spanLabel(s)}` : `${s.id} · ${spanLabel(s)}`;
  c.addEventListener('click', () => { if (n.group) selectGroup(n); else selectSpan(s.id); });
  return c;
}

function toggleCollapse(key) {
  if (state.collapsed.has(key)) state.collapsed.delete(key); else state.collapsed.add(key);
  renderFlow();
}

function markSelection() {
  document.querySelectorAll('#flow-canvas .card').forEach(c => {
    const hit = state.selectedGroup ? c.dataset.group === state.selectedGroup : c.dataset.span === state.selectedSpan;
    c.classList.toggle('selected', !!hit);
  });
  if (!state.selectedGroup && state.selectedSpan && !document.querySelector(`#flow-canvas .card[data-span="${CSS.escape(state.selectedSpan)}"]`)) {
    // the selected call sits inside a grouped run: mark that group
    const trace = state.traces.get(state.selectedTrace);
    document.querySelectorAll('#flow-canvas .card[data-group]').forEach(c => {
      const [first, count] = c.dataset.group.split('/').pop().split('+');
      const i = trace.spans.findIndex(s => s.id === first);
      const sel = trace.spans.findIndex(s => s.id === state.selectedSpan);
      c.classList.toggle('selected', i >= 0 && sel >= i && sel < i + Number(count));
    });
  }
}

function selectSpan(id, focusPath) {
  state.selectedSpan = id;
  state.selectedGroup = null;
  markSelection();
  const node = document.querySelector(`#flow-canvas .card.selected`);
  if (node) node.scrollIntoView({ block: 'nearest', inline: 'nearest' });
  const t0 = performance.now();
  renderDetail(focusPath);
  console.info(`[capture] call ${id} rendered in ${(performance.now() - t0).toFixed(0)} ms`);
  history.replaceState(null, '', `#r=${encodeURIComponent(state.recordingId)}&t=${encodeURIComponent(state.selectedTrace)}&s=${encodeURIComponent(id || '')}${focusPath ? '&p=' + encodeURIComponent(focusPath) : ''}`);
}

function selectGroup(n) {
  state.selectedGroup = n.key;
  state.selectedSpan = null;
  markSelection();
  renderGroupDetail(n);
}

// ---- right: one call, in full -----------------------------------------------------------

function renderGroupDetail(n) {
  const body = $('detail-body');
  body.className = '';
  body.innerHTML = '';
  const s = n.group[0];
  const total = n.group.reduce((a, g) => a + g.durationNs, 0);
  const durations = n.group.map(g => g.durationNs);
  const head = el('div', 'd-head');
  head.innerHTML = `<h3>${esc(spanLabel(s))} <span class="chip count">×${n.group.length}</span></h3>` +
    `<div class="chips"><span class="chip">consecutive calls, grouped</span>${s.ejb && s.ejb.invocation === 'REMOTE' ? '<span class="chip remote">REMOTE</span>' : ''}${s.app ? `<span class="chip app">${esc(s.app)}</span>` : ''}</div>`;
  body.appendChild(head);
  const facts = el('dl', 'facts');
  facts.innerHTML = `<dt>total</dt><dd class="plain">${fmtNs(total)}</dd><dt>min / avg / max</dt><dd class="plain">${fmtNs(Math.min(...durations))} / ${fmtNs(total / n.group.length)} / ${fmtNs(Math.max(...durations))}</dd>` +
    `<dt>calls</dt><dd class="plain">${esc(s.id)} … ${esc(n.group[n.group.length - 1].id)}</dd>`;
  body.appendChild(facts);
  const p = el('p', '', 'Each call is recorded in full; pick one below, or expand the group in the flow.');
  p.style.color = 'var(--muted)'; p.style.fontSize = '12px';
  body.appendChild(p);
  const table = el('table', 'group-table');
  table.innerHTML = '<thead><tr><th>#</th><th>call</th><th>arguments</th><th>result</th><th>duration</th></tr></thead>';
  const tbody = el('tbody');
  const show = Math.min(n.group.length, Math.max(PAGE, state.expanded.get(n.key + '/detail') || 0));
  n.group.slice(0, show).forEach((g, i) => {
    const tr = el('tr', g.id === state.selectedSpan ? 'selected' : '');
    tr.innerHTML = `<td>${i + 1}</td><td>${esc(g.id)}</td><td>${esc(brief(g.args && g.args.map(a => a.value)))}</td><td>${esc(brief(g.result && g.result.value))}</td><td>${fmtNs(g.durationNs)}</td>`;
    tr.addEventListener('click', () => { selectSpan(g.id); });
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  body.appendChild(table);
  if (show < n.group.length) {
    const more = el('button', 'btn small', `show ${Math.min(PAGE * 5, n.group.length - show)} more of ${n.group.length}`);
    more.style.marginTop = '8px';
    more.addEventListener('click', () => { state.expanded.set(n.key + '/detail', show + PAGE * 5); renderGroupDetail(n); });
    body.appendChild(more);
  }
}

function brief(v) {
  const s = JSON.stringify(v, (k, x) => (k === '@type' ? undefined : x));
  return s == null ? '' : s.length > 60 ? s.substring(0, 58) + '…' : s;
}

function renderDetail(focusPath) {
  const body = $('detail-body');
  const trace = state.traces.get(state.selectedTrace);
  const span = trace && trace.spans.find(s => s.id === state.selectedSpan);
  if (!span) { body.className = 'empty'; body.textContent = 'Select a call.'; return; }
  body.className = '';
  body.innerHTML = '';
  const root = trace.spans.find(s => s.parentId == null) || trace.spans[0];
  const summary = state.index.traces.find(t => t.id === trace.trace.id) || {};

  const head = el('div', 'd-head');
  const chips = [];
  chips.push(`<span class="kbadge ${span.kind === 'EJB' ? 'ejb' : 'http'}">${esc(span.kind)}</span>`);
  if (span.layer) chips.push(`<span class="chip">${esc(span.layer)}</span>`);
  if (span.ejb && span.ejb.invocation) chips.push(`<span class="chip ${span.ejb.invocation === 'REMOTE' ? 'remote' : span.ejb.invocation === 'MESSAGE' ? 'handoff' : ''}">${esc(span.ejb.invocation)}</span>`);
  if (span.ejb && span.ejb.transactionAttribute) chips.push(`<span class="chip tx">tx ${esc(span.ejb.transactionAttribute)}</span>`);
  if (span.app) chips.push(`<span class="chip app">${esc(span.app)}${span.module ? ' / ' + esc(span.module) : ''}</span>`);
  if (span.http && span.http.status != null) chips.push(`<span class="chip ${span.http.status >= 400 ? 'status-err' : 'status-ok'}">HTTP ${span.http.status}</span>`);
  if (span.exception) chips.push(`<span class="chip err">✗ ${esc(span.exception.className)}</span>`);
  if (span.selfInvocation) chips.push('<span class="chip self">self-invocation</span>');
  const trunc = truncation(span);
  if (trunc.length) chips.push(`<span class="chip trunc" title="${esc(trunc.join('\n'))}">truncated</span>`);
  head.innerHTML = `<h3>${esc(spanLabel(span))}</h3><div class="chips">${chips.join('')}</div>`;
  body.appendChild(head);

  const facts = el('dl', 'facts');
  const f = [];
  const fact = (k, v, plain) => { if (v != null && v !== '') f.push(`<dt>${esc(k)}</dt><dd${plain ? ' class="plain"' : ''}>${esc(v)}</dd>`); };
  fact('duration', `${fmtNs(span.durationNs)} · started ${fmtNs(span.startNs - root.startNs)} into trace #${summary.seq}`, true);
  if (span.http && !span.layer) fact('request', `${span.http.method || ''} ${span.http.path || ''}${span.http.query ? '?' + span.http.query : ''}`);
  if (span.ejb) { fact('signature', span.ejb.signature); fact('interface', span.ejb.interface); fact('bean', span.ejb.beanClass); }
  if (span.ejb && span.ejb.destination) fact('destination', span.ejb.destination);
  if (span.ejb && span.ejb.jndiNames && span.ejb.jndiNames.length) fact('jndi', span.ejb.jndiNames.join('\n'));
  if (span.http && span.layer) fact('resource', span.http.resourceSignature || `${span.http.resourceClass}.${span.http.resourceMethod}`);
  fact('thread', span.thread);
  fact('id', `${trace.trace.id} / ${span.id}`);
  facts.innerHTML = f.join('');
  facts.querySelectorAll('dd').forEach(dd => { dd.style.whiteSpace = 'pre-wrap'; });
  body.appendChild(facts);

  // thread handoffs: what this call started elsewhere, and (for a root) what started it
  const spawned = state.index.traces.filter(t => t.parentTraceId === trace.trace.id && (t.parentSpanId || rootOf(trace.trace.id)) === span.id);
  if (spawned.length) {
    const box = el('div', 'handoff-box');
    box.appendChild(document.createTextNode('⇢ continued on another thread: '));
    spawned.forEach((t, i) => {
      if (i) box.appendChild(document.createTextNode(' · '));
      const a = el('a', '', `#${t.seq} ${t.rootLabel}`);
      a.addEventListener('click', () => jumpTo(t.id, rootOf(t.id)));
      box.appendChild(a);
    });
    body.appendChild(box);
  }
  if (span.parentId == null && trace.trace.parentTraceId) {
    const parent = state.index.traces.find(t => t.id === trace.trace.parentTraceId);
    const box = el('div', 'handoff-box');
    box.appendChild(document.createTextNode('← handed over from '));
    const a = el('a', '', parent ? `#${parent.seq} ${parent.rootLabel} / ${trace.trace.parentSpanId || 'root'}` : trace.trace.parentTraceId);
    if (parent) a.addEventListener('click', () => jumpTo(parent.id, trace.trace.parentSpanId || rootOf(parent.id)));
    box.appendChild(a);
    box.appendChild(document.createTextNode(' (@Asynchronous or JMS within this server)'));
    body.appendChild(box);
  }

  const badges = lineageBadges(trace.trace.id, span.id);
  const section = (title, count, open, fill) => {
    const d = el('details', 'sec');
    if (open) d.open = true;
    const sum = el('summary');
    sum.innerHTML = `${esc(title)}${count != null ? ` <span class="n">${esc(count)}</span>` : ''}`;
    d.appendChild(sum);
    const json = el('div', 'json');
    fill(json);
    d.appendChild(json);
    body.appendChild(d);
    return json;
  };
  const holders = [];
  if (span.args) holders.push(section('Arguments', `${span.args.length}`, true, j => renderValue(j, span.args, 'args', 0, badges, 'args')));
  if (span.argsBefore) holders.push(section('Arguments before the call', `${span.argsBefore.length}`, false, j => renderValue(j, span.argsBefore, 'argsBefore', 0, badges, 'argsBefore')));
  if (span.result !== undefined) holders.push(section('Result', null, true, j => renderValue(j, span.result, 'result', 0, badges, 'result')));
  if (span.exception) holders.push(section('Exception', simple(span.exception.className), true, j => renderValue(j, span.exception, 'exception', 0, badges, 'exception')));
  if (span.http) holders.push(section('HTTP', span.http.status != null ? `status ${span.http.status}` : null, true, j => renderValue(j, span.http, 'http', 0, badges, 'http')));
  if ((span.serializationWarnings || []).length) holders.push(section('Notes from the capture', `${span.serializationWarnings.length}`, false, j => renderValue(j, span.serializationWarnings, 'serializationWarnings', 0, badges, 'serializationWarnings')));
  holders.push(section('Everything else on this call', null, false, j => {
    for (const k of Object.keys(span)) {
      if (['args', 'argsBefore', 'result', 'exception', 'http', 'serializationWarnings'].includes(k)) continue;
      renderValue(j, span[k], k, 0, badges, k);
    }
  }));
  const unplaced = Object.entries(badges).filter(([, v]) => !v.placed);
  if (unplaced.length) {
    const box = el('div', 'json');
    box.appendChild(el('div', 'k', 'lineage on paths not rendered above:'));
    for (const [path, v] of unplaced) { const r = el('div', 'row'); r.textContent = path + ' '; v.badges.forEach(b => r.appendChild(b)); box.appendChild(r); }
    body.appendChild(box);
  }
  if (focusPath) {
    const target = findRow(body, focusPath);
    if (target) {
      let d = target.closest('details'); if (d) d.open = true;
      target.scrollIntoView({ block: 'center' }); target.classList.remove('flash'); void target.offsetWidth; target.classList.add('flash');
    }
  }
}

// Markers the agent writes for structural necessities; each is highlighted, never hidden.
const MARKERS = { '@type': 'type', '@ref': 'ref', '@id': 'ref', '@lazy': 'lazy', '@handle': 'handle', '@skipped': 'skipped', '@truncated': 'truncated', '@unserializable': 'unserializable', '@serializable': 'unserializable' };

function renderValue(container, value, path, depth, badges, key) {
  const row = el('span', 'row');
  row.style.setProperty('--indent', depth ? '1.2em' : '0');  // rows nest, so each level adds one step
  row.dataset.path = path;
  if (key !== undefined) {
    const k = el('span', 'k', typeof key === 'number' ? `[${key}]` : JSON.stringify(key));
    const marker = typeof key === 'string' && MARKERS[key];
    if (marker) { k.classList.add('m', marker); }
    row.appendChild(k);
    row.appendChild(document.createTextNode(': '));
    if (key === '@serializable' && value === false) row.classList.add('flagged');
    if (key === '@truncated' || key === '@handle' || key === '@lazy' || key === '@unserializable') row.classList.add('flagged');
  }
  if (value === null || value === undefined) {
    row.appendChild(el('span', 'z', 'null'));
  } else if (Array.isArray(value)) {
    if (!value.length) row.appendChild(document.createTextNode('[]'));
    else {
      const fold = el('span', 'fold', `[ ${value.length} ]`);
      const box = el('span', 'block');
      fold.addEventListener('click', () => { box.hidden = !box.hidden; });
      row.appendChild(fold);
      row.appendChild(box);
      value.forEach((v, i) => renderValue(box, v, `${path}[${i}]`, depth + 1, badges, i));
    }
  } else if (typeof value === 'object') {
    const keys = Object.keys(value);
    if (!keys.length) row.appendChild(document.createTextNode('{}'));
    else {
      const fold = el('span', 'fold', `{ ${keys.length} }`);
      const box = el('span', 'block');
      fold.addEventListener('click', () => { box.hidden = !box.hidden; });
      row.appendChild(fold);
      row.appendChild(box);
      for (const k of keys) renderValue(box, value[k], path ? `${path}.${k}` : k, depth + 1, badges, k);
    }
  } else if (typeof value === 'string') {
    if (value.length > 120 || value.includes('\n')) {
      const block = el('span', 'text-block');
      block.textContent = value;
      row.appendChild(el('span', 'z', `string, ${value.length} chars`));
      row.appendChild(block);
    } else {
      row.appendChild(el('span', 's', JSON.stringify(value)));
    }
  } else if (typeof value === 'number') {
    row.appendChild(el('span', 'n', String(value)));
  } else {
    row.appendChild(el('span', 'b', String(value)));
  }
  const b = badges[path];
  if (b) { b.badges.forEach(x => row.appendChild(x)); b.placed = true; }
  container.appendChild(row);
}

function findRow(scope, path) {
  // exact first, then the longest rendered prefix (a value inside a body string, a path segment)
  let p = path;
  while (p) {
    const hit = scope.querySelector(`.row[data-path="${CSS.escape(p)}"]`);
    if (hit) return hit;
    p = parentPath(p);
  }
  return null;
}

function parentPath(p) {
  const i = Math.max(p.lastIndexOf('.'), p.lastIndexOf('['));
  return i <= 0 ? '' : p.substring(0, i);
}

// ---- lineage ----------------------------------------------------------------------------

// A lineage path names the captured value ("args[0].orderId", "result.id", "http.requestBody.x",
// "http.path[4]"); in the span JSON an arg or result wraps its value (args[0].value.orderId), and a
// value inside a body string or the URL is addressed from the field holding it, remainder shown.
function locate(lineagePath) {
  let m;
  if ((m = /^(args\[\d+\])(.*)$/.exec(lineagePath))) return { json: m[1] + '.value' + m[2], remainder: '' };
  if ((m = /^result(.*)$/.exec(lineagePath))) return { json: 'result.value' + m[1], remainder: '' };
  if ((m = /^(http\.(requestBody|responseBody|path|query))(.*)$/.exec(lineagePath))) return { json: m[1], remainder: m[3] };
  return { json: lineagePath, remainder: '' };
}
function jsonPath(lineagePath) { return locate(lineagePath).json; }

function lineageBadges(traceId, spanId) {
  const out = {};
  const put = (lineagePath, badgeEl) => {
    let jp = jsonPath(lineagePath);
    if (!out[jp]) out[jp] = { badges: [], placed: false };
    out[jp].badges.push(badgeEl);
  };
  const seqOf = id => { const t = state.index.traces.find(x => x.id === id); return t ? '#' + t.seq : id; };
  const labelOf = (ref) => {
    const t = state.traces.get(ref.trace || traceId);
    const s = t && t.spans.find(x => x.id === ref.span);
    return s ? spanLabel(s) : ref.span;
  };
  const link = (ref, text) => {
    const a = el('a', '', text);
    a.title = `${ref.trace || traceId} / ${ref.span} / ${ref.path}`;
    a.addEventListener('click', (e) => { e.stopPropagation(); jumpTo(ref.trace || traceId, ref.span, jsonPath(ref.path)); });
    return a;
  };
  for (const entry of state.index.lineage) {
    const to = entry.to || {};
    const toTrace = to.trace || traceId;
    if (toTrace === traceId && to.span === spanId) {
      const b = el('span', 'lineage');
      const remainder = locate(to.path).remainder;
      if (entry.from) {
        b.appendChild(document.createTextNode((remainder ? remainder + ' ' : '') + '← '));
        b.appendChild(link(entry.from, `${seqOf(entry.from.trace)} ${labelOf(entry.from)} / ${entry.from.path}`));
        for (const alt of entry.alternatives || []) {
          b.appendChild(document.createTextNode(' · '));
          const altLink = link(alt, `${seqOf(alt.trace)} ${labelOf(alt)} / ${alt.path}`);
          altLink.classList.add('alt');
          b.appendChild(document.createTextNode('also: '));
          b.appendChild(altLink);
        }
        if (entry.alsoProducedHere) b.appendChild(document.createTextNode(' · also produced in this trace'));
      } else {
        b.classList.add('class-' + entry.classification);
        b.textContent = (remainder ? remainder + ' ' : '') + entry.classification;
      }
      b.title = `value ${entry.value}`;
      put(to.path, b);
    }
    if (entry.from && (entry.from.trace || traceId) === traceId && entry.from.span === spanId) {
      const b = el('span', 'lineage uses');
      const remainder = locate(entry.from.path).remainder;
      b.appendChild(document.createTextNode((remainder ? remainder + ' ' : '') + '→ '));
      b.appendChild(link({ trace: toTrace, span: to.span, path: to.path }, `${seqOf(toTrace)} ${labelOf({ trace: toTrace, span: to.span })} / ${to.path}`));
      b.title = `value ${entry.value}`;
      put(entry.from.path, b);
    }
  }
  return out;
}

function jumpTo(traceId, spanId, path) {
  if (state.selectedTrace !== traceId) {
    selectTrace(traceId, spanId);
    if (path) renderDetail(path);
  } else {
    selectSpan(spanId, path);
  }
}

// ---- keyboard ---------------------------------------------------------------------------

document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT') return;
  const i = state.order.indexOf(state.selectedTrace);
  if (e.key === 'ArrowDown' && i >= 0 && i + 1 < state.order.length) { e.preventDefault(); selectTrace(state.order[i + 1]); }
  else if (e.key === 'ArrowUp' && i > 0) { e.preventDefault(); selectTrace(state.order[i - 1]); }
  else if ((e.key === 'ArrowLeft' || e.key === 'ArrowRight') && state.selectedSpan) {
    e.preventDefault();
    const key = `${state.selectedTrace}/${state.selectedSpan}`;
    if (e.key === 'ArrowLeft') state.collapsed.add(key); else state.collapsed.delete(key);
    renderFlow();
  }
});

// ---- helpers ------------------------------------------------------------------------------

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
function simple(name) { if (!name) return '?'; const i = name.lastIndexOf('.'); return i < 0 ? name : name.substring(i + 1); }
function shorten(s, n) { s = s || ''; return s.length > n ? s.substring(0, n) + '…' : s; }
function shortThread(t) { if (!t) return ''; const m = /ExecuteThread: '(\d+)'/.exec(t); return m ? `thread ${m[1]}` : t; }

</script>
</body>
</html>
