<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ejb-capture</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="bar">
    <a id="nav-home" class="brand" href="#">ejb-capture</a>
    <span id="state-message" class="pill">…</span>
    <span id="servers" class="servers"></span>
    <span class="controls">
      <a id="active-link" hidden></a>
      <input id="name" type="text" placeholder="recording name (optional)" size="22">
      <button id="btn-start" class="btn primary" disabled>Start</button>
      <button id="btn-stop" class="btn" disabled>Stop</button>
      <span id="start-reason" class="reason"></span>
    </span>
  </div>
</header>
<section id="home">
  <h1>Recordings</h1>
  <p id="domain-meta" class="hint"></p>
  <div id="home-body" class="empty">loading…</div>
</section>
<section id="recording" hidden>
  <div class="rec-bar">
    <a href="#">‹ recordings</a>
    <span id="recording-meta"></span>
    <span class="spacer"></span>
    <button id="btn-details" class="btn small" title="show the details window">Details</button>
    <span id="rec-delete"></span>
    <span class="legend">
      <span><svg width="34" height="10"><line x1="0" y1="5" x2="26" y2="5" stroke="#475569" stroke-width="1.6"/><path d="M26,1 L33,5 L26,9 z" fill="#475569"/></svg>call</span>
      <span><svg width="34" height="10"><line x1="8" y1="5" x2="34" y2="5" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="5 3"/><path d="M8,1 L1,5 L8,9 z" fill="#fff" stroke="#94a3b8"/></svg>return</span>
      <span><svg width="34" height="10"><line x1="0" y1="5" x2="26" y2="5" stroke="#475569" stroke-width="1.6" stroke-dasharray="1.5 4" stroke-linecap="round"/><path d="M26,1 L33,5 L26,9 z" fill="#475569"/></svg>continues on another thread</span>
      <span><svg width="14" height="10"><rect x="2" y="1" width="10" height="8" rx="2" fill="#dc2626"/></svg>failed</span>
    </span>
  </div>
  <section id="seq"><div id="zoomwrap"><div id="lanes"><div class="apps" id="apps"></div><div class="heads" id="heads"></div></div><div id="body" class="empty">loading…</div></div></section>
</section>
<div id="win" hidden><div class="titlebar" id="win-title"><b id="win-name">Details</b><button id="win-close" title="close">×</button></div><div id="detail-body" class="empty">Select a call.</div></div>
<script src="diagram.js"></script>
<script src="app.js"></script>
</body>
</html>
