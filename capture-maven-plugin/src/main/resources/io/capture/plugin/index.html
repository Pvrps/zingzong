<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ejb-capture</title>
<style>
  :root {
    --bg: #fafafa; --fg: #1d1d1d; --muted: #6b6b6b; --line: #dcdcdc; --sel: #e3edff; --sel-line: #7aa2ff;
    --ejb: #2b6cb0; --http: #2f855a; --remote: #b7791f; --self: #805ad5; --err: #c53030; --trunc: #c05621;
    --marker: #fff5d6; --ref: #e6fffa; --lazy: #fefcbf; --handle: #fed7d7; --skipped: #e2e8f0; --type: #ebf4ff;
    --badge: #ffe8cc; --badge-line: #f6ad55; --flash: #fff176;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; font: 13px/1.4 system-ui, sans-serif; color: var(--fg); background: var(--bg); }
  main { display: grid; grid-template-columns: 300px minmax(380px, 1fr) minmax(420px, 1.2fr); }
  .keys { margin-left: auto; color: var(--muted); font-size: 12px; }
  main > section { overflow: auto; border-right: 1px solid var(--line); padding: 8px; }
  main > section:last-child { border-right: none; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 4px 0 8px; }

  /* lanes */
  .lane { margin-bottom: 14px; }
  .lane-head { font-size: 12px; color: var(--muted); padding: 2px 4px; border-bottom: 1px dashed var(--line); margin-bottom: 4px; }
  .lane-head b { color: var(--fg); }
  .trace { display: grid; grid-template-columns: 28px 1fr auto; gap: 6px; padding: 4px 6px; border-radius: 4px; cursor: pointer; border: 1px solid transparent; }
  .trace:hover { background: #f0f0f0; }
  .trace.selected { background: var(--sel); border-color: var(--sel-line); }
  .trace .seq { color: var(--muted); }
  .trace .label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .trace .dur { color: var(--muted); font-variant-numeric: tabular-nums; }
  .trace .sub { grid-column: 2 / 4; color: var(--muted); font-size: 11px; }
  .trace.child { margin-left: 14px; border-left: 2px solid #f6ad55; }
  .trace .cause, .spawned a { color: #7b341e; text-decoration: underline; cursor: pointer; }
  .spawned { margin: 6px 0; font: 12px system-ui, sans-serif; background: var(--badge); border: 1px solid var(--badge-line); border-radius: 3px; padding: 2px 6px; display: inline-block; }

  /* tree */
  .node { display: flex; align-items: baseline; gap: 6px; padding: 2px 4px; border-radius: 4px; cursor: pointer; white-space: nowrap; border: 1px solid transparent; }
  .node:hover { background: #f0f0f0; }
  .node.selected { background: var(--sel); border-color: var(--sel-line); }
  .node .twist { width: 12px; display: inline-block; color: var(--muted); text-align: center; }
  .node .dur { color: var(--muted); font-variant-numeric: tabular-nums; margin-left: auto; padding-left: 10px; }
  .children { margin-left: 16px; border-left: 1px dotted var(--line); padding-left: 4px; }
  .badge { display: inline-block; font-size: 10.5px; line-height: 1.3; padding: 0 5px; border-radius: 3px; border: 1px solid; font-weight: 600; letter-spacing: .02em; }
  .badge.ejb { color: var(--ejb); border-color: var(--ejb); }
  .badge.http { color: var(--http); border-color: var(--http); }
  .badge.layer { color: var(--muted); border-color: var(--line); font-weight: 500; }
  .badge.remote { color: #fff; background: var(--remote); border-color: var(--remote); }
  .badge.self { color: #fff; background: var(--self); border-color: var(--self); }
  .badge.err { color: #fff; background: var(--err); border-color: var(--err); }
  .badge.trunc { color: #fff; background: var(--trunc); border-color: var(--trunc); }
  .badge.warn { color: var(--trunc); border-color: var(--trunc); }

  /* detail */
  .detail-head { margin-bottom: 8px; }
  .detail-head .path { color: var(--muted); font-family: ui-monospace, monospace; font-size: 12px; }
  .json { font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap; word-break: break-word; }
  .json .row { display: block; padding-left: var(--indent, 0); }
  .json .k { color: #4a5568; }
  .json .s { color: #2b6cb0; }
  .json .n { color: #805ad5; }
  .json .b { color: #b7791f; }
  .json .z { color: var(--muted); }
  .json .m { background: var(--marker); border-radius: 2px; padding: 0 2px; }
  .json .m.type { background: var(--type); }
  .json .m.ref { background: var(--ref); }
  .json .m.lazy { background: var(--lazy); }
  .json .m.handle { background: var(--handle); }
  .json .m.skipped { background: var(--skipped); }
  .json .m.truncated { background: #fbd38d; }
  .json .m.unserializable { background: var(--handle); }
  .json .row.flagged { outline: 2px solid var(--err); outline-offset: -1px; background: #fff5f5; }
  .json .row.flash { animation: flash 1.6s ease-out; }
  @keyframes flash { 0% { background: var(--flash); } 100% { background: transparent; } }
  .json .fold { cursor: pointer; color: var(--muted); user-select: none; }
  .json .text-block { display: block; margin: 2px 0 2px 1em; padding: 4px 6px; background: #fff; border: 1px solid var(--line); border-radius: 3px; max-height: 320px; overflow: auto; white-space: pre-wrap; }
  .lineage { display: inline-block; margin-left: 8px; font: 11px system-ui, sans-serif; background: var(--badge); border: 1px solid var(--badge-line); border-radius: 3px; padding: 0 5px; vertical-align: baseline; }
  .lineage a { color: #7b341e; text-decoration: underline; cursor: pointer; }
  .lineage .alt { color: var(--muted); }
  .lineage.class-userInput { background: #e6fffa; border-color: #38b2ac; }
  .lineage.class-environment { background: #edf2f7; border-color: #a0aec0; }
  .lineage.uses { background: #ebf8ff; border-color: #63b3ed; }
  .empty { color: var(--muted); padding: 20px; }
  .err-box { color: var(--err); padding: 20px; white-space: pre-wrap; }
  /* layout: header (two bars), then home or the recording view filling the rest */
  header { display: block; padding: 0; }
  .bar { display: flex; gap: 12px; align-items: center; padding: 6px 12px; border-bottom: 1px solid var(--line); background: #fff; flex-wrap: wrap; }
  .bar.sub { padding: 4px 12px; font-size: 12px; color: var(--muted); background: #fcfcfc; }
  .bar.rec-bar { background: #fcfcfc; font-size: 12px; }
  .nav { font-weight: 700; color: var(--fg); text-decoration: none; }
  .nav.current { text-decoration: underline; }
  #active-link { font-weight: 500; color: #7b341e; margin-left: 8px; }
  .state { padding: 2px 8px; border-radius: 4px; border: 1px solid var(--line); }
  .state.ok { background: #e6fffa; border-color: #38b2ac; }
  .state.warn { background: #fffff0; border-color: #ecc94b; }
  .state.bad { background: #fff5f5; border-color: #fc8181; }
  .controls { display: inline-flex; gap: 6px; align-items: center; margin-left: auto; }
  .controls button { font: inherit; padding: 2px 12px; }
  .controls .reason { color: var(--muted); font-size: 12px; max-width: 520px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .servers .server { display: inline-block; margin-left: 10px; padding: 0 6px; border-radius: 3px; border: 1px solid var(--line); background: #fff; color: var(--fg); }
  .servers .server.agent { border-color: #38b2ac; }
  .servers .server.noagent { border-color: #fc8181; background: #fff5f5; }
  .servers .server.none { border-style: dashed; color: var(--muted); }
  #home { padding: 8px 12px; }
  #recording main { height: calc(100vh - 118px); }
  table.recordings { border-collapse: collapse; font-size: 13px; }
  table.recordings th, table.recordings td { text-align: left; padding: 4px 10px; border-bottom: 1px solid var(--line); }
  table.recordings th { color: var(--muted); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; }
  table.recordings tr.active td { background: #fffaf0; }
  .badge.rec { color: #fff; background: #dd6b20; border-color: #dd6b20; }
</style>
</head>
<body>
<header>
  <div class="bar">
    <a id="nav-home" class="nav current" href="#">ejb-capture</a>
    <span id="state-message" class="state">…</span>
    <span class="controls">
      <input id="name" placeholder="name (optional)" size="18">
      <button id="btn-start" disabled>Start</button>
      <button id="btn-stop" disabled>Stop</button>
      <span id="start-reason" class="reason"></span>
      <a id="active-link" class="nav" hidden></a>
    </span>
  </div>
  <div class="bar sub">
    <span id="domain-meta" class="meta"></span>
    <span id="servers" class="servers"></span>
  </div>
</header>
<section id="home">
  <h2>Recordings</h2>
  <div id="home-body" class="empty">loading…</div>
</section>
<section id="recording" hidden>
  <div class="bar rec-bar">
    <span id="recording-meta" class="meta"></span>
    <label><input type="checkbox" id="hide-self"> hide self-invocations</label>
    <label><input type="checkbox" id="only-roots"> only root spans</label>
    <span class="keys">↑/↓ trace · ←/→ collapse/expand · everything shown; nothing is summarized</span>
  </div>
  <main>
    <section id="traces"><h2>Traces</h2><div id="lanes"></div></section>
    <section id="tree"><h2>Spans</h2><div id="tree-body" class="empty">Select a trace.</div></section>
    <section id="detail"><h2>Span</h2><div id="detail-body" class="empty">Select a span.</div></section>
  </main>
</section>
<script>
'use strict';

// ---- state --------------------------------------------------------------------------------

const state = {
  domain: null,           // last /api/state
  view: 'home',           // 'home' | 'recording'
  recordingId: null,
  index: null,            // /api/recordings/{id}
  traces: new Map(),      // trace id -> trace JSON (kept across index refreshes)
  order: [],              // trace ids in index order
  selectedTrace: null,
  selectedSpan: null,
  collapsed: new Set(),   // "traceId/spanId"
  hideSelf: false,
  onlyRoots: false,
  busy: false,            // a start/stop request in flight
};

const $ = id => document.getElementById(id);

async function api(path, options) {
  const r = await fetch(path, Object.assign({ cache: 'no-store' }, options || {}));
  const text = await r.text();
  let body = null;
  try { body = text ? JSON.parse(text) : null; } catch (e) { body = { error: text }; }
  if (!r.ok) throw new Error(body && body.error ? body.error : `${r.status} ${path}`);
  return body;
}

// ---- top bar: state, servers, start/stop -----------------------------------------------

async function pollState() {
  try {
    state.domain = await api('/api/state');
    renderTop();
  } catch (e) {
    $('state-message').textContent = `page server unreachable: ${e.message}`;
    $('state-message').className = 'state bad';
    $('btn-start').disabled = true;
    $('btn-stop').disabled = true;
  }
}

function renderTop() {
  const d = state.domain;
  const msg = $('state-message');
  msg.textContent = d.message;
  msg.className = 'state ' + (d.kind === 'READY' ? 'ok' : d.kind === 'ENABLED_SERVER_DOWN' ? 'warn' : 'bad');
  $('domain-meta').textContent = `${d.domain} · WebLogic ${d.webLogicVersion} · recordings in ${d.outDir}`;
  const servers = $('servers');
  servers.innerHTML = '';
  if (!d.servers.length) servers.appendChild(el('span', 'server none', 'no server JVM of this domain is running'));
  for (const s of d.servers) {
    const span = el('span', 'server ' + (s.agentLoaded ? 'agent' : 'noagent'));
    span.textContent = `${s.serverName} pid ${s.pid}: ` + (s.agentLoaded
      ? (s.recording ? `recording ${s.recordingId} (${s.traceCount} trace${s.traceCount === 1 ? '' : 's'}${s.droppedTraces ? ', ' + s.droppedTraces + ' dropped' : ''})` : 'agent loaded, idle')
      : 'no agent, restart it');
    if (s.agentLoaded && !s.agentCurrent) span.textContent += ' · older agent build than the installed one; restart to update';
    span.title = s.agentBuild ? `agent ${s.agentBuild}` : '';
    servers.appendChild(span);
  }
  const active = d.activeRecordingId;
  const start = $('btn-start');
  const stop = $('btn-stop');
  start.disabled = state.busy || !d.ready || !!active;
  stop.disabled = state.busy || !active;
  $('start-reason').textContent = start.disabled && !state.busy
    ? (active ? `recording ${active} is active` : d.message) : '';
  $('name').disabled = start.disabled;
  const link = $('active-link');
  if (active) {
    link.hidden = false;
    link.textContent = `watch ${active}${d.activeRecordingName ? ' (' + d.activeRecordingName + ')' : ''}`;
    link.href = `#r=${encodeURIComponent(active)}`;
  } else {
    link.hidden = true;
  }
}

async function startCapture() {
  state.busy = true; renderTop();
  try {
    const r = await api('/api/capture/start', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name: $('name').value || null }) });
    $('name').value = '';
    await pollState();
    location.hash = `#r=${encodeURIComponent(r.id)}`;
  } catch (e) {
    alert(`could not start: ${e.message}`);
  } finally {
    state.busy = false; renderTop();
  }
}

async function stopCapture() {
  state.busy = true; renderTop();
  try {
    await api('/api/capture/stop', { method: 'POST' });
    await pollState();
    if (state.view === 'recording') await refreshRecording();
    else await renderHome();
  } catch (e) {
    alert(`could not stop: ${e.message}`);
  } finally {
    state.busy = false; renderTop();
  }
}

// ---- home: all recordings -------------------------------------------------------------------

async function renderHome() {
  const list = await api('/api/recordings');
  const body = $('home-body');
  body.innerHTML = '';
  if (!list.length) {
    body.appendChild(el('div', 'empty', 'No recordings yet. Start one above, then drive the application.'));
    return;
  }
  const table = el('table', 'recordings');
  table.innerHTML = '<thead><tr><th></th><th>recording</th><th>name</th><th>started</th><th>duration</th><th>traces</th><th>servers</th></tr></thead>';
  const tbody = el('tbody');
  for (const r of list) {
    const tr = el('tr', r.active ? 'active' : '');
    const duration = r.startedAt && r.endedAt ? fmtDuration(Date.parse(r.endedAt) - Date.parse(r.startedAt)) : (r.active ? 'running' : r.startedAt ? 'unfinished' : '');
    tr.innerHTML = `<td>${r.active ? '<span class="badge rec">ACTIVE</span>' : ''}</td><td><a href="#r=${encodeURIComponent(r.id)}">${esc(r.id)}</a></td><td>${esc(r.name || '')}</td>` +
      `<td>${esc(fmtTime(r.startedAt))}</td><td>${esc(duration)}</td><td>${r.traceCount}</td><td>${esc((r.servers || []).join(', '))}</td>`;
    tbody.appendChild(tr);
  }
  table.appendChild(tbody);
  body.appendChild(table);
}

// ---- recording view -----------------------------------------------------------------------------

async function openRecording(id, hash) {
  state.view = 'recording';
  if (state.recordingId !== id) {
    state.recordingId = id;
    state.index = null;
    state.traces = new Map();
    state.order = [];
    state.selectedTrace = null;
    state.selectedSpan = null;
    state.collapsed = new Set();
  }
  showView();
  try {
    await refreshRecording();
  } catch (e) {
    $('lanes').innerHTML = `<div class="err-box">${esc(String(e))}</div>`;
    return;
  }
  const wanted = hash.get('t') && state.traces.has(hash.get('t')) ? hash.get('t') : (state.selectedTrace || state.order[0]);
  if (wanted) {
    if (hash.get('p')) jumpTo(wanted, hash.get('s') || rootOf(wanted), hash.get('p'));
    else selectTrace(wanted, hash.get('s') || undefined);
  }
}

/** Reloads the index, fetches traces not seen yet, re-renders the lanes keeping the selection. */
async function refreshRecording() {
  const id = state.recordingId;
  const index = await api(`/api/recordings/${encodeURIComponent(id)}`);
  if (state.recordingId !== id) return;
  const ordered = index.traces.slice();
  const missing = ordered.filter(t => !state.traces.has(t.id));
  await Promise.all(missing.map(async t => {
    const trace = await api(`/api/recordings/${encodeURIComponent(id)}/traces/${encodeURIComponent(t.file)}`);
    state.traces.set(t.id, trace);
  }));
  if (state.recordingId !== id) return;
  const changed = !state.index || state.index.traces.length !== ordered.length || missing.length > 0;
  state.index = index;
  state.order = ordered.map(t => t.id);
  const r = index.recording || {};
  const agent = r.agent || {};
  const active = state.domain && state.domain.activeRecordingId === id;
  $('recording-meta').innerHTML = `<b>${esc(r.name || '')}</b> ${esc(r.id || '')} · ${index.traces.length} traces · ${index.sessions.length} session lanes · ` +
    `${index.lineage.length} lineage entries · hook=${esc(agent.hook || '?')} · servers=${esc((r.servers || [r.serverName]).filter(Boolean).join(', ') || '?')}` +
    (active ? ' · <span class="badge rec">ACTIVE</span> new traces appear as their root completes' : r.endedAt ? '' : ' · unfinished (no end recorded)');
  if (changed) {
    renderLanes();
    if (state.selectedTrace && state.traces.has(state.selectedTrace)) {
      document.querySelectorAll('.trace').forEach(x => x.classList.toggle('selected', x.dataset.trace === state.selectedTrace));
      if (missing.length) {
        // lineage may now point into a trace that just landed: redraw the detail, keep the span
        renderTree();
        renderDetail();
      }
    } else if (state.order.length) {
      selectTrace(state.order[state.order.length - 1]);
    }
  }
}

// ---- routing & polling --------------------------------------------------------------------------

function showView() {
  $('home').hidden = state.view !== 'home';
  $('recording').hidden = state.view !== 'recording';
  $('nav-home').classList.toggle('current', state.view === 'home');
}

async function route() {
  const h = new URLSearchParams(location.hash.replace(/^#/, ''));
  if (h.get('r')) {
    await openRecording(h.get('r'), h);
  } else {
    state.view = 'home';
    showView();
    await renderHome();
  }
}

async function tick() {
  await pollState();
  try {
    if (state.view === 'home') await renderHome();
    else if (state.view === 'recording' && state.domain && state.domain.activeRecordingId === state.recordingId) await refreshRecording();
  } catch (e) {
    // transient while files are being written; the next tick retries
  }
}

window.addEventListener('hashchange', route);
$('btn-start').addEventListener('click', startCapture);
$('btn-stop').addEventListener('click', stopCapture);
$('name').addEventListener('keydown', e => { if (e.key === 'Enter' && !$('btn-start').disabled) startCapture(); });

function fmtTime(iso) { return iso ? iso.replace('T', ' ').replace(/\.\d+Z$/, 'Z') : ''; }
function fmtDuration(ms) { return ms < 1000 ? `${ms} ms` : ms < 60000 ? `${(ms / 1000).toFixed(1)} s` : `${Math.floor(ms / 60000)} min ${Math.round((ms % 60000) / 1000)} s`; }

(async () => { await pollState(); await route(); setInterval(tick, 1000); })();

// ---- left: session lanes --------------------------------------------------------------

function renderLanes() {
  const lanes = $('lanes');
  lanes.innerHTML = '';
  const byId = new Map(state.index.traces.map(t => [t.id, t]));
  for (const session of state.index.sessions) {
    const lane = el('div', 'lane');
    const head = el('div', 'lane-head');
    head.innerHTML = `<b>${esc(session.kind)}</b> ${esc(shorten(session.key, 28))} · ${session.traceIds.length} trace${session.traceIds.length === 1 ? '' : 's'}`;
    head.title = session.key || '';
    lane.appendChild(head);
    for (const id of session.traceIds) {
      const t = byId.get(id);
      if (!t) continue;
      const row = el('div', 'trace' + (t.parentTraceId ? ' child' : ''));
      row.dataset.trace = id;
      const parent = t.parentTraceId ? byId.get(t.parentTraceId) : null;
      row.innerHTML = `<span class="seq">${t.parentTraceId ? '↳' : ''}#${t.seq}</span><span class="label">${esc(t.rootLabel || '?')}</span><span class="dur">${t.durationMs} ms</span>` +
        `<span class="sub">${esc(t.startedAt || '')}${t.principal ? ' · ' + esc(t.principal) : ''}${t.failed ? ' · <span class="badge err">failed</span>' : ''}` +
        `${t.warningCount ? ' · ' + t.warningCount + ' warning' + (t.warningCount === 1 ? '' : 's') : ''}</span>`;
      if (t.parentTraceId) {
        const sub = row.querySelector('.sub');
        sub.appendChild(document.createTextNode(' · caused by '));
        const a = el('a', 'cause', `${parent ? '#' + parent.seq : t.parentTraceId}${t.parentSpanId ? ' / ' + t.parentSpanId : ''}`);
        a.title = `${t.parentTraceId}${t.parentSpanId ? ' / ' + t.parentSpanId : ''}: the span that handed this work to another thread`;
        a.addEventListener('click', (e) => { e.stopPropagation(); if (parent) jumpTo(t.parentTraceId, t.parentSpanId || rootOf(t.parentTraceId)); });
        sub.appendChild(a);
      }
      row.title = `${t.id} · ${t.spanCount} spans`;
      row.addEventListener('click', () => selectTrace(id));
      lane.appendChild(row);
    }
    lanes.appendChild(lane);
  }
}

function selectTrace(id, spanId) {
  state.selectedTrace = id;
  document.querySelectorAll('.trace').forEach(r => r.classList.toggle('selected', r.dataset.trace === id));
  const row = document.querySelector(`.trace[data-trace="${CSS.escape(id)}"]`);
  if (row) row.scrollIntoView({ block: 'nearest' });
  const trace = state.traces.get(id);
  const root = trace.spans.find(s => s.parentId == null) || trace.spans[0];
  renderTree();
  selectSpan(spanId || (root && root.id));
}

// ---- centre: span tree ----------------------------------------------------------------

function spanLabel(s) {
  if (s.ejb) return `${s.ejb.beanName || simple(s.ejb.beanClass)}.${s.ejb.method}`;
  if (s.http) {
    if (s.layer && s.http.resourceClass) return `${simple(s.http.resourceClass)}.${s.http.resourceMethod}`;
    return `${s.http.method || ''} ${s.http.path || ''}`;
  }
  return s.kind || '?';
}

function truncation(s) {
  const reasons = [];
  if (s.http) {
    if (s.http.requestBodyDropped) reasons.push(`request body: ${s.http.requestBodyDropped} bytes dropped`);
    if (s.http.responseBodyDropped) reasons.push(`response body: ${s.http.responseBodyDropped} bytes dropped`);
    if (s.http.requestBodyComplete === false) reasons.push('request body incomplete');
  }
  for (const w of s.serializationWarnings || []) {
    if (/limit|truncat|dropped/i.test(w.reason || '')) reasons.push(`${w.path}: ${w.reason}`);
  }
  let found = false;
  walk(s.args, v => { if (v && typeof v === 'object' && '@truncated' in v) found = true; });
  walk(s.result, v => { if (v && typeof v === 'object' && '@truncated' in v) found = true; });
  if (found) reasons.push('@truncated marker in args/result');
  return reasons;
}

function walk(v, fn) {
  if (v == null) return;
  fn(v);
  if (Array.isArray(v)) v.forEach(x => walk(x, fn));
  else if (typeof v === 'object') Object.values(v).forEach(x => walk(x, fn));
}

function renderTree() {
  const body = document.getElementById('tree-body');
  body.className = '';
  body.innerHTML = '';
  const trace = state.traces.get(state.selectedTrace);
  if (!trace) return;
  const byId = new Map(trace.spans.map(s => [s.id, s]));
  const children = new Map();
  let roots = [];
  for (const s of trace.spans) {
    if (s.parentId == null || !byId.has(s.parentId)) roots.push(s);
    else (children.get(s.parentId) || children.set(s.parentId, []).get(s.parentId)).push(s);
  }
  for (const list of children.values()) list.sort((a, b) => a.order - b.order);
  // hide self-invocations: the span disappears, its children move up to its parent
  const visibleChildren = (s) => {
    const out = [];
    for (const c of children.get(s.id) || []) {
      if (state.hideSelf && c.selfInvocation) out.push(...visibleChildren(c));
      else out.push(c);
    }
    return out;
  };
  const render = (s, container, depth) => {
    const kids = state.onlyRoots ? [] : visibleChildren(s);
    const key = `${trace.trace.id}/${s.id}`;
    const row = el('div', 'node');
    row.dataset.span = s.id;
    const twist = el('span', 'twist');
    twist.textContent = kids.length ? (state.collapsed.has(key) ? '▸' : '▾') : '·';
    row.appendChild(twist);
    row.appendChild(badge(s.kind === 'EJB' ? 'ejb' : 'http', s.kind));
    if (s.layer) row.appendChild(badge('layer', s.layer));
    const label = el('span', 'label');
    label.textContent = spanLabel(s);
    row.appendChild(label);
    if (s.ejb && s.ejb.invocation === 'REMOTE') row.appendChild(badge('remote', 'REMOTE'));
    if (s.selfInvocation) row.appendChild(badge('self', 'self-invocation'));
    if (s.exception) row.appendChild(badge('err', `✗ ${simple(s.exception.className)}`));
    const trunc = truncation(s);
    if (trunc.length) { const b = badge('trunc', 'truncated'); b.title = trunc.join('\n'); row.appendChild(b); }
    const warnings = (s.serializationWarnings || []).length;
    if (warnings && !trunc.length) { const b = badge('warn', `${warnings} warning${warnings === 1 ? '' : 's'}`); b.title = (s.serializationWarnings || []).map(w => `${w.path}: ${w.reason}`).join('\n'); row.appendChild(b); }
    const dur = el('span', 'dur');
    dur.textContent = `${(s.durationNs / 1e6).toFixed(3)} ms`;
    row.appendChild(dur);
    row.addEventListener('click', (e) => {
      if (e.target === twist && kids.length) toggleCollapse(key);
      else selectSpan(s.id);
    });
    container.appendChild(row);
    if (kids.length && !state.collapsed.has(key)) {
      const box = el('div', 'children');
      for (const c of kids) render(c, box, depth + 1);
      container.appendChild(box);
    }
  };
  for (const r of roots) render(r, body, 0);
  if (state.selectedSpan) document.querySelectorAll('.node').forEach(n => n.classList.toggle('selected', n.dataset.span === state.selectedSpan));
}

function toggleCollapse(key) {
  if (state.collapsed.has(key)) state.collapsed.delete(key); else state.collapsed.add(key);
  renderTree();
}

function selectSpan(id, focusPath) {
  state.selectedSpan = id;
  document.querySelectorAll('.node').forEach(n => n.classList.toggle('selected', n.dataset.span === id));
  const node = document.querySelector(`.node[data-span="${CSS.escape(id || '')}"]`);
  if (node) node.scrollIntoView({ block: 'nearest' });
  renderDetail(focusPath);
  // a shareable link to what is on screen
  history.replaceState(null, '', `#r=${encodeURIComponent(state.recordingId)}&t=${encodeURIComponent(state.selectedTrace)}&s=${encodeURIComponent(id || '')}${focusPath ? '&p=' + encodeURIComponent(focusPath) : ''}`);
}

function rootOf(traceId) {
  const t = state.traces.get(traceId);
  const r = t.spans.find(s => s.parentId == null) || t.spans[0];
  return r && r.id;
}

// ---- right: the span, in full ---------------------------------------------------------

function renderDetail(focusPath) {
  const body = document.getElementById('detail-body');
  const trace = state.traces.get(state.selectedTrace);
  const span = trace && trace.spans.find(s => s.id === state.selectedSpan);
  if (!span) { body.className = 'empty'; body.textContent = 'Select a span.'; return; }
  body.className = '';
  body.innerHTML = '';
  const head = el('div', 'detail-head');
  head.innerHTML = `<b>${esc(spanLabel(span))}</b> <span class="path">${esc(trace.trace.id)} / ${esc(span.id)}</span>`;
  body.appendChild(head);
  // Thread handoffs: what this span caused on other threads, and (for a root) what caused it.
  const spawned = state.index.traces.filter(t => t.parentTraceId === trace.trace.id && (t.parentSpanId || rootOf(trace.trace.id)) === span.id);
  if (spawned.length) {
    const box = el('div', 'spawned');
    box.appendChild(document.createTextNode('→ handed off to another thread: '));
    spawned.forEach((t, i) => {
      if (i) box.appendChild(document.createTextNode(' · '));
      const a = el('a', '', `#${t.seq} ${t.rootLabel}`);
      a.addEventListener('click', () => jumpTo(t.id, rootOf(t.id)));
      box.appendChild(a);
    });
    body.appendChild(box);
  }
  if (span.parentId == null && trace.trace.parentTraceId) {
    const parent = state.index.traces.find(t => t.id === trace.trace.parentTraceId);
    const box = el('div', 'spawned');
    box.appendChild(document.createTextNode('← caused by '));
    const a = el('a', '', parent ? `#${parent.seq} ${parent.rootLabel} / ${trace.trace.parentSpanId || 'root'}` : trace.trace.parentTraceId);
    if (parent) a.addEventListener('click', () => jumpTo(parent.id, trace.trace.parentSpanId || rootOf(parent.id)));
    box.appendChild(a);
    box.appendChild(document.createTextNode(' on another thread (@Asynchronous or JMS within this server)'));
    body.appendChild(box);
  }
  const json = el('div', 'json');
  const badges = lineageBadges(trace.trace.id, span.id);
  renderValue(json, span, '', 0, badges);
  body.appendChild(json);
  const unplaced = Object.entries(badges).filter(([, v]) => !v.placed);
  if (unplaced.length) {
    const box = el('div', 'json');
    box.appendChild(el('div', 'k', 'lineage on paths not rendered above:'));
    for (const [path, v] of unplaced) { const r = el('div', 'row'); r.textContent = path + ' '; v.badges.forEach(b => r.appendChild(b)); box.appendChild(r); }
    body.appendChild(box);
  }
  if (focusPath) {
    const target = findRow(json, focusPath);
    if (target) { target.scrollIntoView({ block: 'center' }); target.classList.remove('flash'); void target.offsetWidth; target.classList.add('flash'); }
  }
}

// Markers the agent writes for structural necessities; each is highlighted, never hidden.
const MARKERS = { '@type': 'type', '@ref': 'ref', '@id': 'ref', '@lazy': 'lazy', '@handle': 'handle', '@skipped': 'skipped', '@truncated': 'truncated', '@unserializable': 'unserializable', '@serializable': 'unserializable' };

function renderValue(container, value, path, depth, badges, key) {
  const row = el('span', 'row');
  row.style.setProperty('--indent', depth ? '1.2em' : '0');  // rows nest, so each level adds one step
  row.dataset.path = path;
  if (key !== undefined) {
    const k = el('span', 'k', typeof key === 'number' ? `[${key}]` : JSON.stringify(key));
    const marker = typeof key === 'string' && MARKERS[key];
    if (marker) { k.classList.add('m', marker); }
    row.appendChild(k);
    row.appendChild(document.createTextNode(': '));
    if (key === '@serializable' && value === false) row.classList.add('flagged');
    if (key === '@truncated' || key === '@handle' || key === '@lazy' || key === '@unserializable') row.classList.add('flagged');
  }
  if (value === null || value === undefined) {
    row.appendChild(el('span', 'z', 'null'));
  } else if (Array.isArray(value)) {
    if (!value.length) row.appendChild(document.createTextNode('[]'));
    else {
      const fold = el('span', 'fold', `[ ${value.length} ]`);
      const box = el('span', 'block');
      fold.addEventListener('click', () => { box.hidden = !box.hidden; });
      row.appendChild(fold);
      row.appendChild(box);
      value.forEach((v, i) => renderValue(box, v, `${path}[${i}]`, depth + 1, badges, i));
    }
  } else if (typeof value === 'object') {
    const keys = Object.keys(value);
    if (!keys.length) row.appendChild(document.createTextNode('{}'));
    else {
      const fold = el('span', 'fold', `{ ${keys.length} }`);
      const box = el('span', 'block');
      fold.addEventListener('click', () => { box.hidden = !box.hidden; });
      row.appendChild(fold);
      row.appendChild(box);
      for (const k of keys) renderValue(box, value[k], path ? `${path}.${k}` : k, depth + 1, badges, k);
    }
  } else if (typeof value === 'string') {
    if (value.length > 120 || value.includes('\n')) {
      const block = el('span', 'text-block');
      block.textContent = value;
      row.appendChild(el('span', 'z', `string, ${value.length} chars`));
      row.appendChild(block);
    } else {
      row.appendChild(el('span', 's', JSON.stringify(value)));
    }
  } else if (typeof value === 'number') {
    row.appendChild(el('span', 'n', String(value)));
  } else {
    row.appendChild(el('span', 'b', String(value)));
  }
  const b = badges[path];
  if (b) { b.badges.forEach(x => row.appendChild(x)); b.placed = true; }
  container.appendChild(row);
}

function findRow(json, path) {
  // exact first, then the longest rendered prefix (a value inside a body string, a path segment)
  let p = path;
  while (p) {
    const hit = json.querySelector(`.row[data-path="${CSS.escape(p)}"]`);
    if (hit) return hit;
    p = parentPath(p);
  }
  return null;
}

function parentPath(p) {
  const i = Math.max(p.lastIndexOf('.'), p.lastIndexOf('['));
  return i <= 0 ? '' : p.substring(0, i);
}

// ---- lineage ----------------------------------------------------------------------------

// A lineage path names the captured value ("args[0].orderId", "result.id", "http.requestBody.x",
// "http.path[4]"); in the span JSON an arg or result wraps its value (args[0].value.orderId), and a
// value inside a body string or the URL is addressed from the field holding it, remainder shown.
function locate(lineagePath) {
  let m;
  if ((m = /^(args\[\d+\])(.*)$/.exec(lineagePath))) return { json: m[1] + '.value' + m[2], remainder: '' };
  if ((m = /^result(.*)$/.exec(lineagePath))) return { json: 'result.value' + m[1], remainder: '' };
  if ((m = /^(http\.(requestBody|responseBody|path|query))(.*)$/.exec(lineagePath))) return { json: m[1], remainder: m[3] };
  return { json: lineagePath, remainder: '' };
}
function jsonPath(lineagePath) { return locate(lineagePath).json; }

function lineageBadges(traceId, spanId) {
  const out = {};
  const put = (lineagePath, badgeEl) => {
    let jp = jsonPath(lineagePath);
    if (!out[jp]) out[jp] = { badges: [], placed: false };
    out[jp].badges.push(badgeEl);
  };
  const seqOf = id => { const t = state.index.traces.find(x => x.id === id); return t ? '#' + t.seq : id; };
  const labelOf = (ref) => {
    const t = state.traces.get(ref.trace || traceId);
    const s = t && t.spans.find(x => x.id === ref.span);
    return s ? spanLabel(s) : ref.span;
  };
  const link = (ref, text) => {
    const a = el('a', '', text);
    a.title = `${ref.trace || traceId} / ${ref.span} / ${ref.path}`;
    a.addEventListener('click', (e) => { e.stopPropagation(); jumpTo(ref.trace || traceId, ref.span, jsonPath(ref.path)); });
    return a;
  };
  for (const entry of state.index.lineage) {
    const to = entry.to || {};
    const toTrace = to.trace || traceId;
    if (toTrace === traceId && to.span === spanId) {
      const b = el('span', 'lineage');
      const remainder = locate(to.path).remainder;
      if (entry.from) {
        b.appendChild(document.createTextNode((remainder ? remainder + ' ' : '') + '← '));
        b.appendChild(link(entry.from, `${seqOf(entry.from.trace)} ${labelOf(entry.from)} / ${entry.from.path}`));
        for (const alt of entry.alternatives || []) {
          b.appendChild(document.createTextNode(' · '));
          const altLink = link(alt, `${seqOf(alt.trace)} ${labelOf(alt)} / ${alt.path}`);
          altLink.classList.add('alt');
          b.appendChild(document.createTextNode('also: '));
          b.appendChild(altLink);
        }
        if (entry.alsoProducedHere) b.appendChild(document.createTextNode(' · also produced in this trace'));
      } else {
        b.classList.add('class-' + entry.classification);
        b.textContent = (remainder ? remainder + ' ' : '') + entry.classification;
      }
      b.title = `value ${entry.value}`;
      put(to.path, b);
    }
    if (entry.from && (entry.from.trace || traceId) === traceId && entry.from.span === spanId) {
      const b = el('span', 'lineage uses');
      const remainder = locate(entry.from.path).remainder;
      b.appendChild(document.createTextNode((remainder ? remainder + ' ' : '') + '→ '));
      b.appendChild(link({ trace: toTrace, span: to.span, path: to.path }, `${seqOf(toTrace)} ${labelOf({ trace: toTrace, span: to.span })} / ${to.path}`));
      b.title = `value ${entry.value}`;
      put(entry.from.path, b);
    }
  }
  return out;
}

function jumpTo(traceId, spanId, path) {
  if (state.selectedTrace !== traceId) {
    state.selectedSpan = spanId;
    selectTrace(traceId, spanId);
    renderDetail(path);
  } else {
    selectSpan(spanId, path);
  }
}

// ---- keyboard & toggles ---------------------------------------------------------------

// ---- keyboard & toggles ---------------------------------------------------------------

document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT') return;
  const i = state.order.indexOf(state.selectedTrace);
  if (e.key === 'ArrowDown' && i >= 0 && i + 1 < state.order.length) { e.preventDefault(); selectTrace(state.order[i + 1]); }
  else if (e.key === 'ArrowUp' && i > 0) { e.preventDefault(); selectTrace(state.order[i - 1]); }
  else if ((e.key === 'ArrowLeft' || e.key === 'ArrowRight') && state.selectedSpan) {
    e.preventDefault();
    const key = `${state.selectedTrace}/${state.selectedSpan}`;
    if (e.key === 'ArrowLeft') state.collapsed.add(key); else state.collapsed.delete(key);
    renderTree();
  }
});
document.getElementById('hide-self').addEventListener('change', (e) => { state.hideSelf = e.target.checked; renderTree(); });
document.getElementById('only-roots').addEventListener('change', (e) => { state.onlyRoots = e.target.checked; renderTree(); });

// ---- helpers ------------------------------------------------------------------------------

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; }
function badge(cls, text) { return el('span', 'badge ' + cls, text); }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
function simple(name) { if (!name) return '?'; const i = name.lastIndexOf('.'); return i < 0 ? name : name.substring(i + 1); }
function shorten(s, n) { s = s || ''; return s.length > n ? s.substring(0, n) + '…' : s; }

</script>
</body>
</html>
