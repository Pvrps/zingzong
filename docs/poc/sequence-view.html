window.addEventListener("resize", render);
// ---- panel content ---------------------------------------------------------------------------------
function pretty(v) { const json = JSON.stringify(v, null, 2); return esc(json).replace(/^(\s*)("[^"]+"): /gm, (m, sp, k) => `${sp}<span class="${k === '&quot;@type&quot;' ? 't' : 'k'}">${k}</span>: `).replace(/: (&quot;[^\n]*&quot;)(,?)$/gm, ': <span class="s">$1</span>$2').replace(/: (-?\d[\d.]*|true|false)(,?)$/gm, ': <span class="n">$1</span>$2'); }
function chainOf(s) { const p = []; for (let x = s; x;) { p.unshift({ span: x }); if (x.parent) x = x.parent; else if (x.trace.cause) { p.unshift({ hop: x.comp.type === 'MDB' ? 'JMS' : '@Asynchronous' }); x = x.trace.cause; } else x = null; } return p; }
function entryOf(s) { let t = s.trace; while (t.cause) t = t.cause.trace; return t; }
function renderPanel() {
  const p = document.getElementById("panel"); p.innerHTML = ""; const s = state.sel;
  document.getElementById("win-name").textContent = s ? label(s) : "Details";
  if (!s) {
    p.appendChild(el("h3", "", "Reading the diagram"));
    p.appendChild(el('p', 'hint', 'Time runs down. Each lane is one service, grouped under its application. A solid arrow is a call, the dashed arrow under it is its return; the bar between them is how long the service was busy with it. Work that moved to another thread (JMS, @Asynchronous) is drawn right under the call that started it, marked "continues on another thread". Click any call for its input and output.'));
    p.appendChild(el('h2', '', 'Entry points')); const list = el('div', 'list');
    for (const t of entries) { const root = t.spans[0], it = el('div', 'item'); it.innerHTML = `<span class="seq">#${t.seq}</span><span class="title">${esc(label(root))}</span><span class="dur">${fmt(t.durationMs)}</span><span class="sub">${esc(t.startedAt.replace('T', ' ').replace('Z', ''))}${root.http ? ' · HTTP ' + root.http.status : ''}${t.synthetic ? ' · synthetic example' : ''}</span>`; it.addEventListener('click', () => select(root)); list.appendChild(it); }
    p.appendChild(list); return;
  }
  const isReq = s.comp.type === 'CLIENT', res = s.row && s.row.resource, k = isReq ? (res ? res.kind : 'CLIENT') : s.kind;
  const chips = el('div', 'chips');
  chips.innerHTML = `<span class="chip">${esc(KIND_TEXT[k])}</span>` + (s.comp.app || (res && res.comp.app) ? `<span class="chip">${esc(s.comp.app || res.comp.app)}</span>` : '') + (s.invocation ? `<span class="chip">${esc(s.invocation)}</span>` : '') + (s.tx ? `<span class="chip">tx ${esc(s.tx)}</span>` : '') + (s.http ? `<span class="chip ${s.http.status < 400 ? '' : 'err'}">HTTP ${s.http.status}</span>` : '') + (s.exception ? `<span class="chip err">✗ ${esc(s.exception.className.split('.').pop())}</span>` : '');
  p.appendChild(chips);
  p.appendChild(el('h2', '', 'How we got here')); const path = el('div', 'path'); let depth = 0; const e = entryOf(s);
  path.innerHTML = `<div class="hint">entry point #${e.seq}</div>`;
  for (const step of chainOf(s)) { if (step.hop) { path.innerHTML += `<div style="padding-left:${depth * 14}px"><span class="hopl">↓ another thread (${step.hop})</span></div>`; continue; } path.innerHTML += `<div style="padding-left:${depth * 14}px">${depth ? '↳ ' : ''}${step.span === s ? '<b>' + esc(label(step.span)) + '</b>' : esc(label(step.span))}</div>`; depth++; }
  p.appendChild(path);
  p.appendChild(el('h2', '', 'Facts')); const facts = el('dl', 'facts'); const f = []; const fact = (kk, v) => { if (v) f.push(`<dt>${esc(kk)}</dt><dd>${esc(v)}</dd>`); };
  fact('duration', fmt(s.durMs)); fact('started', `${fmt(s.startMs - s.trace.spans[0].startMs)} into ${s.trace.cause ? 'its thread' : 'the request'}`); fact('thread', `ExecuteThread ${s.thread}`); fact('signature', s.signature || (res && res.signature)); fact('interface', s.iface); fact('request', s.http && `${s.http.method} ${s.http.path}`); if (res) fact('resource method', label(res));
  facts.innerHTML = f.join(''); p.appendChild(facts);
  if (s.exception) { p.appendChild(el('h2', '', 'Exception')); const ex = el('div', 'ex'); ex.innerHTML = `<b>${esc(s.exception.className)}</b><br>${esc(s.exception.message || '')}`; p.appendChild(ex); }
  p.appendChild(el('h2', '', 'Input'));
  if (isReq) { const pre = el('pre', 'val'); pre.innerHTML = s.http && s.http.requestBody ? pretty(safeJson(s.http.requestBody)) : '<span class="t">no request body</span>'; p.appendChild(pre); }
  else if (!s.args.length) p.appendChild(el('p', 'hint', 'no arguments'));
  else s.args.forEach((a, i) => { const h = el('div', 'val-h'); h.innerHTML = `<span>argument ${i}</span><code>${esc(a && a['@type'] ? a['@type'] : typeof a)}</code>`; p.appendChild(h); const pre = el('pre', 'val'); pre.innerHTML = pretty(a); p.appendChild(pre); });
  p.appendChild(el('h2', '', 'Output'));
  if (isReq) { const pre = el('pre', 'val'); pre.innerHTML = s.http && s.http.responseBody ? pretty(safeJson(s.http.responseBody)) : '<span class="t">no response body</span>'; p.appendChild(pre); }
  else if (s.exception) p.appendChild(el('p', 'hint', 'none: the call threw'));
  else { const pre = el('pre', 'val'); pre.innerHTML = s.result === null ? '<span class="t">void / null</span>' : pretty(s.result); p.appendChild(pre); }
  if (s.spawns) { p.appendChild(el('h2', '', 'Continued on another thread')); for (const c of s.spawns) { const a = el('a', '', `↓ ${label(c.spans[0])} (${c.spans[0].queue ? 'JMS' : '@Asynchronous'}, +${fmt(Date.parse(c.startedAt) - Date.parse(s.trace.startedAt))})`); a.style.cssText = 'display:block;cursor:pointer;color:var(--ejb);margin:2px 0'; a.addEventListener('click', () => select(c.spans[0])); p.appendChild(a); } }
}
document.getElementById('title').textContent = 'unnamed · rec-20261023-221155';
document.getElementById('meta').textContent = `${entries.length} entry points · ${traces.length} threads of work · ${traces[0].startedAt.replace('T', ' ')} → +${fmt(Math.max(...traces.map(t => Date.parse(t.startedAt) + t.durationMs)) - Date.parse(traces[0].startedAt))} · AdminServer`;
render(); renderPanel();
const want = /^#s=(\d+)\.(\d+)/.exec(location.hash); if (want) select(DATA[Number(want[1]) - 1].spans[Number(want[2])]);
</script>
